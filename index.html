<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>토익 700 트레이너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: Apple-style grouped layout — light gray canvas, white rounded cards, system type, one blue accent; big bold numerals carry the hierarchy */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#F2F2F7; --line:#E5E5EA; --ink:#1D1D1F; --muted:#6E6E73;
  --primary:#0071E3; --primary-ink:#FFFFFF; --primary-soft:#E8F1FC;
  --hl:#FFD60A; --hl-soft:rgba(255,214,10,.32);
  --ok:#248A3D; --ok-soft:#E8F5EB; --bad:#D70015; --bad-soft:#FCEBEC;
  --shadow:0 1px 2px rgba(0,0,0,.03);
  --print:var(--primary); --rule:var(--line); --paper:var(--surface-2); --sheet:var(--surface); --print-soft:var(--primary-soft); --graphite:var(--ink); --on-graphite:var(--surface);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  --f-mono:var(--f-display);
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#38383A; --ink:#F5F5F7; --muted:#98989D;
  --primary:#0A84FF; --primary-ink:#FFFFFF; --primary-soft:#0A2A4D;
  --hl:#FFD60A; --hl-soft:rgba(255,214,10,.22);
  --ok:#30D158; --ok-soft:#10291A; --bad:#FF453A; --bad-soft:#331513;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#38383A; --ink:#F5F5F7; --muted:#98989D;
  --primary:#0A84FF; --primary-ink:#FFFFFF; --primary-soft:#0A2A4D;
  --hl:#FFD60A; --hl-soft:rgba(255,214,10,.22);
  --ok:#30D158; --ok-soft:#10291A; --bad:#FF453A; --bad-soft:#331513;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 80px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 45%,transparent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
a{color:var(--primary);text-decoration:none}

/* hero */
header.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-block:44px 28px;flex-wrap:wrap}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted)}
header.hero h1{margin:4px 0 8px;font-family:var(--f-display);font-weight:700;font-size:clamp(32px,7vw,44px);line-height:1.08;letter-spacing:-.035em;text-wrap:balance}
.goal{font-size:15px;color:var(--muted)}
.goal .num{color:var(--ink);font-weight:600}
.goal .arrow{margin:0 4px}
.dday{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.dd-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.dday .big{font-family:var(--f-display);font-weight:700;font-size:clamp(48px,11vw,72px);letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--ink)}

/* tabs: segmented control */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:3px;border-radius:12px;
  background:color-mix(in srgb,var(--surface-2) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;border:none;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 1px rgba(0,0,0,.04)}
nav.tabs .badge{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}

main{padding-top:24px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.03em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.02em;margin:0}
.label{font-size:13px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.sheet{background:var(--surface);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;background:var(--primary);color:var(--primary-ink);padding:11px 20px;border-radius:980px;font-weight:600;font-size:15px;transition:filter .15s,background .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.ghost{background:var(--surface-2);color:var(--primary)}
.btn.print{background:var(--primary);color:var(--primary-ink)}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);letter-spacing:-.005em}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stats > div{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.stats .v{font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.stats .k{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.35}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

/* schedule */
.days{display:flex;flex-direction:column;gap:12px}
.day{background:var(--surface);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow);border:2px solid transparent}
.day.today{border-color:var(--primary)}
.day.past{opacity:.5}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.day-h .tag{font-size:12px;font-weight:600;color:var(--primary-ink);background:var(--primary);padding:3px 10px;border-radius:980px}
.check{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer;border-top:1px solid var(--line)}
.day-h + .check{border-top:none}
.check input{appearance:none;flex:0 0 22px;width:22px;height:22px;margin-top:1px;border:1.5px solid #C7C7CC;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:transparent;transition:background .15s,border-color .15s}
.check input:checked{background:var(--primary);border-color:var(--primary)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.where{font-size:12px;font-weight:600;padding:1px 8px;border-radius:980px;margin-left:6px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.where.here{background:var(--primary-soft);color:var(--primary)}

.mock{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px 12px;align-items:center}
.mock input,.sheet select{width:100%;max-width:120px;padding:10px 12px;border:none;border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.sheet select{max-width:100%;font-size:14px}
#gkeyin{border:none!important;background:var(--surface-2)!important;border-radius:10px!important}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--primary);border-radius:2px;transition:width .3s}
.qno{font-weight:600;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.cat{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:3px 10px;border-radius:980px}
.qtext{font-family:var(--f-display);font-size:21px;line-height:1.6;margin:22px 0;font-weight:600;letter-spacing:-.02em}
.qtext .blank{display:inline-block;min-width:80px;height:1.1em;vertical-align:-.18em;border-bottom:2px solid var(--primary);margin:0 3px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);padding:13px 16px;border-radius:14px;font-size:16px;transition:background .15s,border-color .15s}
.opt:disabled{cursor:default}
.bub{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--surface-2);color:var(--muted)}
.opt.picked{border-color:var(--primary);background:var(--primary-soft)}
.opt.picked .bub{background:var(--primary);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);color:#fff}
.feedback{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--ok-soft);font-size:15px}
.feedback.no{background:var(--bad-soft)}
.feedback b{display:block;margin-bottom:3px;color:var(--ok)}
.feedback.no b{color:var(--bad)}
.timer{font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer.slow{color:var(--bad)}
.result-big{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.word-big{font-family:var(--f-display);font-size:40px;font-weight:700;margin:16px 0 2px;letter-spacing:-.04em}

/* lists */
.list{display:flex;flex-direction:column}
.li{padding:13px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.wl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.wl .h{grid-column:1/-1;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.known{background:var(--ok)} .dot.weak{background:var(--bad)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:0}
.seg button{border:none;background:none;padding:5px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

details.adv{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
details.adv summary{cursor:pointer;font-size:14px;font-weight:600}
/* auto-run flash + vocab */
.flash{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:17px;text-align:center;animation:flashin .18s ease-out}
.flash.ok{background:var(--ok-soft);color:var(--ok)}
.flash.no{background:var(--bad-soft);color:var(--bad)}
@keyframes flashin{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.mastery{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);margin-top:12px;gap:2px}
.mastery i{display:block;height:100%}
.m-known{background:var(--ok)}.m-weak{background:var(--bad)}
/* analytics */
.est{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:8px}
.est-n{font-size:64px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.est-u{font-size:20px;font-weight:600;color:var(--muted);margin-left:4px}
.est-lr{display:flex;gap:24px}
.est-lr div{display:flex;flex-direction:column}
.est-lr b{font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.est-lr span{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-bar{width:14px;height:8px;border-radius:2px;background:var(--primary);display:inline-block}
.lg-tick{width:2px;height:12px;background:var(--ink);display:inline-block}
.partbars{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.pb-row{display:grid;grid-template-columns:5.2em minmax(0,1fr) 6.5em;gap:12px;align-items:center;font-size:14px}
.pb-l.wide{grid-column:1/-1;margin-bottom:-6px;font-size:13px;color:var(--muted)}
.pb-row:has(.pb-l.wide){grid-template-columns:minmax(0,1fr) 6.5em}
.pb-track{position:relative;height:10px;border-radius:5px;background:var(--surface-2)}
.pb-bar{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--primary)}
.pb-bar.weak{background:var(--bad)}
.pb-tick{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.pb-v{text-align:right;font-weight:600}
.pb-v small{font-weight:400;color:var(--muted);font-size:12px}
details.tbl{margin-top:14px}
details.tbl summary{cursor:pointer;font-size:13px;color:var(--primary);font-weight:600}
.chart2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
@media (max-width:600px){.chart2{grid-template-columns:1fr}}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .val{fill:var(--ink);font-size:11px;font-weight:600}
.chart .bar{fill:var(--primary)}
.chart .line{fill:none;stroke:var(--primary);stroke-width:2}
.chart .dot{fill:var(--primary);stroke:var(--surface);stroke-width:2}
.insight{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:15px}
/* timed mode */
.switch{position:relative;flex:0 0 51px;width:51px;height:31px;border:none;border-radius:999px;background:var(--line);padding:0;transition:background .2s}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.limitchip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:980px;padding:2px 10px;font-size:12px;font-weight:600}
.limitchip.on{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
/* wrong-answer tracking */
.why{margin-top:12px;padding:14px;border-radius:14px;background:var(--surface-2)}
.why-h{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trap{font-size:12px;font-weight:600;color:var(--bad);background:var(--bad-soft);padding:1px 8px;border-radius:980px}
.why-chips,.vchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip,.vchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:980px;padding:6px 12px;font-size:13px;font-weight:500}
.wchip[aria-pressed="true"],.vchip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.presc{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.presc-tip{margin:0;font-size:14px}
.ai-why{width:100%;padding:12px 14px;border-radius:12px;background:var(--surface);font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:8px}
.ai-why p{margin:0}
.ai-why b{display:block;font-size:12px;color:var(--primary);margin-bottom:2px}
.presc-clue{margin:0;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface);width:100%}
.presc-clue b{color:var(--primary);font-size:12px;margin-right:4px}
.vchips{margin-bottom:4px}
.btn.sm{padding:8px 14px;font-size:13px}
.memo{width:100%;margin-top:10px;padding:9px 12px;border:none;border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.toplist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.toplist li{font-size:15px}
.toplist li span{margin-right:6px}
.toplist li b{color:var(--bad);font-size:13px}
.checklist{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.checklist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:15px}
.checklist li::before{content:"";flex:0 0 6px;height:6px;border-radius:50%;background:var(--primary);margin-right:4px}
.checklist li span{flex:1}
.ai-out{margin-top:10px;padding:14px;border-radius:12px;background:var(--surface-2);font-size:15px;line-height:1.65}

button,.opt,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:700px){
  .actbar{position:sticky;bottom:0;z-index:4;background:var(--surface);margin-inline:-24px;padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:nowrap}
  .actbar .btn{flex:1;padding:14px 12px}
  .actbar .note{display:none}
  #fab{width:52px;height:52px;padding:0;justify-content:center;border-radius:50%}
  #fab span{display:none}
  body.quiz-mode #fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
/* floating AI tutor */
#fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;
  border:none;background:var(--ink);color:var(--surface);padding:13px 18px;border-radius:980px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08);transition:transform .15s}
#cpanel{position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:400px;max-width:calc(100vw - 32px);
  display:flex;flex-direction:column;background:var(--bg);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.22),0 0 0 1px var(--line);overflow:hidden}
#cpanel[hidden]{display:none!important}
.cp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 16px 12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.cp-title b{display:block;font-size:17px;letter-spacing:-.02em}
.cp-title span{font-size:12px;color:var(--muted)}
.cp-actions{display:flex;gap:6px;align-items:center}
.cp-btn{border:none;background:var(--surface-2);color:var(--muted);border-radius:980px;padding:6px 12px;font-size:13px;font-weight:600}
.cp-x{width:32px;height:32px;padding:0;display:grid;place-items:center}
.cp-body{flex:1;overflow-y:auto;padding:16px;overscroll-behavior:contain}
.cp-chips{padding:0 16px 8px}
.cp-chips:empty{display:none}
.cp-chips .chip{font-size:13px;padding:7px 12px;background:var(--surface)}
.composer.cp-composer{position:static;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg)}
#cpanel .msg{max-width:90%}
@media (min-width:1200px){body.cp-open .wrap{margin-left:max(20px,calc((100vw - 436px - 720px)/2));margin-right:436px}}
@media (max-width:700px){
  #cpanel{left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;height:min(86vh,720px);border-radius:22px 22px 0 0}
  #fab{padding:12px 16px}
}

/* parts */
.partseg{display:flex;width:100%;padding:3px;border-radius:12px}
.partseg button{flex:1;padding:8px 6px;font-size:14px}
.scene{display:flex;gap:10px;align-items:flex-start;padding:16px;border-radius:14px;background:var(--surface-2);font-size:15px;line-height:1.55}
.scene-tag{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);padding:2px 8px;border-radius:980px;margin-top:1px}
.lopts{display:flex;gap:8px}
.opt.mini{flex:1;justify-content:center;padding:12px 0}
.opt.mini .bub{flex-basis:32px;height:32px;font-size:14px}
.docs{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.doc{background:var(--surface-2);border-radius:14px;padding:18px}
.doc-type{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);padding:2px 9px;border-radius:980px}
.doc-title{white-space:pre-line;font-size:14px;color:var(--muted);margin:10px 0 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.doc-body{white-space:pre-line;font-size:16px;line-height:1.7;margin-top:10px}
.blank6{display:inline-block;min-width:64px;text-align:center;border-bottom:2px solid var(--primary);color:var(--primary);font-weight:700;font-size:13px;margin:0 2px}
.fill6{font-weight:700;color:var(--ok);border-bottom:2px solid var(--ok);padding:0 2px}
.fill6.no{color:var(--bad);border-color:var(--bad)}
mark.clue{background:var(--hl-soft);color:inherit;border-radius:3px;padding:0 1px}

/* review */
.rv-top{display:flex;align-items:center;gap:28px;margin-top:10px;flex-wrap:wrap}
.rv-kpis{display:flex;flex-direction:column;gap:8px;flex:1;min-width:220px}
.rv-kpis > div{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rv-kpis > div:last-child{border-bottom:none;padding-bottom:0}
.rv-kpis b{font-size:18px;font-weight:700;min-width:64px;letter-spacing:-.02em}
.rv-kpis span{font-size:14px;color:var(--muted)}
.rv-kpis b.bad,.bad{color:var(--bad)}
.okc{color:var(--ok)}
.catlist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.catrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.5em;gap:12px;align-items:center;font-size:15px}
.catrow > span:last-child{text-align:right}
.bar{display:block;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.coach{margin:10px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.coach li{padding:12px 14px;background:var(--surface-2);border-radius:12px;font-size:15px;line-height:1.55}
.coach li b{display:block;font-size:13px;color:var(--primary);margin-bottom:2px}
.rv{padding:18px 0;border-top:1px solid var(--line)}
.rv:first-of-type{margin-top:8px}
.rv-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:980px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.rv-q{font-size:17px;font-weight:500;line-height:1.6;margin:10px 0}
.fill{font-weight:700;color:var(--ok);border-bottom:2px solid var(--ok);padding:0 2px}
.rv-opts{display:flex;flex-wrap:wrap;gap:6px}
.rv-o{font-size:13px;padding:4px 11px;border-radius:980px;background:var(--surface-2);color:var(--muted)}
.rv-o.right{background:var(--ok-soft);color:var(--ok);font-weight:600}
.rv-o.wrong{background:var(--bad-soft);color:var(--bad)}
.rv-ex{margin:10px 0 6px;font-size:15px;color:var(--ink)}
.link{border:none;background:none;color:var(--primary);font-weight:600;padding:0;font-size:14px}
.link::after{content:" ›"}

/* tips */
details.tip{background:var(--surface);border-radius:var(--r);padding:0 22px;box-shadow:var(--shadow)}
details.tip summary{cursor:pointer;padding:18px 0;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px;letter-spacing:-.02em}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"";width:8px;height:8px;margin-top:6px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;flex:0 0 auto}
details.tip[open] summary::after{transform:rotate(-135deg);margin-top:10px}
details.tip ul{margin:0 0 18px;padding-left:20px}
details.tip li{margin:7px 0}
.kbd{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;background:var(--surface-2);padding:1px 7px;border-radius:6px}
table.t{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:14px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
.tablewrap{overflow-x:auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--muted);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 15px;border-radius:20px;line-height:1.5;overflow-wrap:anywhere;min-width:0}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--surface)}
.msg .acts{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.msg .acts .btn{padding:8px 14px;font-size:14px}
.msg .err{color:var(--bad);font-size:13px;margin-top:6px}
.msg .thinking{color:var(--muted)}
.composer{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;height:44px;max-height:140px;padding:10px 16px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);font:inherit;line-height:1.5}
.composer .btn{height:44px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:none;background:var(--surface-2);color:var(--primary);border-radius:980px;padding:8px 14px;font-size:14px;font-weight:500}

/* listening */
.lq{display:flex;flex-direction:column;gap:8px;padding:18px 0;border-top:1px solid var(--line)}
.lq:first-of-type{border-top:none}
.lq .qt{font-weight:600;letter-spacing:-.02em}
.lq .opt{padding:10px 14px;font-size:15px}
.lq .bub{flex-basis:26px;height:26px;font-size:12px}
.phase{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--surface-2);margin:16px 0 4px;flex-wrap:wrap;font-size:15px}
.phase .count{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--primary);min-width:2.5ch;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:18px}
.eq i{width:3px;background:var(--primary);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.script{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.sl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:9px 10px;border-radius:12px}
.sl .sp{font-size:13px;font-weight:600;color:var(--muted);padding-top:1px}
.sl.clue{background:var(--hl-soft)}
.sl.now{box-shadow:inset 0 0 0 2px var(--primary)}
.sl .ko{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.sl .ct{display:inline-block;font-size:11px;font-weight:700;color:#1D1D1F;background:var(--hl);border-radius:980px;padding:1px 8px;margin-left:6px;white-space:nowrap;vertical-align:1px}
@media (prefers-reduced-motion:reduce){.spin,.eq i{animation:none}.eq i{height:10px}.progress i,.btn,.opt,nav.tabs button{transition:none}}
@media (hover:hover) and (pointer:fine){
nav.tabs button:hover{color:var(--ink)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost:hover:not(:disabled){filter:brightness(.97)}
.opt:hover:not(:disabled){border-color:var(--primary)}
#fab:hover{transform:translateY(-1px)}
.chip:hover{background:var(--primary-soft)}
}

const CAT_TIPS=[

  [/시제/,"시간 단서를 찾으세요: since/for → 현재완료, by the time+과거 → 과거완료, if·when 절은 미래 대신 현재."],

  [/어휘|collocation|표현/,"빈칸 바로 뒤 전치사가 힌트예요: comply with, apply for, be responsible for. 표현째로 외우세요."],
  [/비교/,"비교급 강조는 much/even/far/still, the+최상급, as ~ as 원급. very는 비교급을 못 꾸며요."],
  [/관계/,"선행사가 사람/사물인지, 빈칸 뒤에 주어나 목적어가 빠졌는지 보세요. 뒤가 완전하면 whose나 관계부사."],
  [/가정법|도치/,"Should/Had/Were로 시작하면 If가 생략된 도치예요. Should you have questions = If you should have questions."],

  [/동사\s*원형|원형|요구/,"ask, request, suggest, require that 뒤에는 동사원형(should 생략). 수동이면 be p.p."],

function tipFor(cat){const t=CAT_TIPS.find(([re])=>re.test(cat||""));return t?t[1]:"해설을 다시 읽고 핵심 단서가 문장 어디에 있었는지 표시해보세요.";}

function p5Review(){
  const R=P.res,n=R.length,c=R.filter(r=>r.ok).length,avg=Math.round(R.reduce((a,r)=>a+r.sec,0)/n);
  const slow=R.filter(r=>r.sec>20),wrong=R.filter(r=>!r.ok);
  const overall=S.st.n?Math.round(S.st.c/S.st.n*100):null;
  const by={};R.forEach(r=>{const k=r.q.cat||"기타";by[k]=by[k]||{n:0,c:0,sec:0};by[k].n++;by[k].c+=r.ok?1:0;by[k].sec+=r.sec;});
  const cats=Object.entries(by).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n||b[1].n-a[1].n);
  const weak=cats.filter(([k,v])=>v.c<v.n).map(([k])=>k);
  const cum=Object.entries(S.catSt||{}).filter(([k,v])=>v.n>=3).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).slice(0,3);
  const coach=[];

async function genQ(focus){
  genState={busy:true,msg:""};render();
  const mix=focus&&focus.length?`이 유형 위주로 만들어줘(학생이 방금 틀린 유형): ${focus.join(", ")}. 유형 이름(cat)도 이 이름을 그대로 써.`:"유형을 고르게 섞어: 품사 자리, 동사 시제·태·수일치, 전치사 vs 접속사, 관계사, 어휘(함께 쓰이는 표현).";
  const prompt=`토익 Part 5(단문 빈칸 채우기) 실전 문제 10개를 새로 만들어줘. 대상: 목표 700점 수험생, 난이도 중~중상.
${mix}
규칙: 실제 토익처럼 비즈니스 상황 문장. 빈칸은 "-------"로 표시. 보기 4개 중 정답이 정확히 하나만 되도록 스스로 검토할 것.
해설은 한국어로 1~2문장, 왜 그게 답인지 핵심 단서를 짚어줘.
JSON 배열만 출력: [{"q":"문장","c":["보기1","보기2","보기3","보기4"],"a":정답 인덱스(0~3),"cat":"유형(한국어 2~6자)","ex":"해설"}]`;
  try{
    const arr=await sample.json(prompt,{modelTier:"default",cache:false});
    const ok=(Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.q==="string"&&/-{3,}/.test(x.q)&&Array.isArray(x.c)&&x.c.length===4&&Number.isInteger(x.a)&&x.a>=0&&x.a<4)
      .map((x,i)=>({id:"g"+Date.now().toString(36)+i,q:x.q,c:x.c.map(String),a:x.a,cat:String(x.cat||""),ex:String(x.ex||"")}));
    if(!ok.length)throw {code:"invalid_json"};
    S.gen=(S.gen||[]).concat(ok);save();
    genState={busy:false,msg:ok.length+"문제 추가됐어요."};
    startP5(ok);return;
  }catch(e){genState={busy:false,msg:errMsg(e)};}
  render();
}
async function genW(){
  genState={busy:true,msg:""};render();
  const have=allWords().map(w=>w.w).join(", ");
  const prompt=`토익에 자주 나오는 단어·표현 20개를 골라줘. 목표 700점 수험생용. 다음 목록에 있는 건 제외: ${have}
JSON 배열만 출력: [{"w":"영어 단어/표현","m":"한국어 뜻 (짧게, 15자 이내)","h":"토익에 자주 나오는 짧은 영어 표현 예시"}]`;
  try{
    const arr=await sample.json(prompt,{modelTier:"default",cache:false});
    const exist=new Set(allWords().map(w=>w.w.toLowerCase()));
    const ok=(Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.w==="string"&&typeof x.m==="string"&&!exist.has(x.w.toLowerCase())).map(x=>({w:x.w,m:x.m,h:String(x.h||"")}));
    if(!ok.length)throw {code:"invalid_json"};
    S.genW=(S.genW||[]).concat(ok);save();
    genState={busy:false,msg:ok.length+"개 추가됐어요. 퀴즈에 먼저 나와요."};
  }catch(e){genState={busy:false,msg:errMsg(e)};}
  render();
}
function errMsg(e){
  const c=e&&e.code;
  if(c==="not_granted"){sample=null;return "허용하지 않아서 만들 수 없어요. 기본 문제로 계속 공부하면 돼요.";}
  if(c==="bad_key")return "Google API 키가 맞지 않아요. 키를 다시 확인해주세요.";
  if(c==="network")return "인터넷 연결을 확인해주세요.";
  if(c==="rate_limited")return "요청이 많아요. 1분쯤 뒤에 다시 눌러주세요.";
  if(c==="invalid_json")return "결과가 이상하게 나왔어요. 다시 한 번 눌러주세요.";
  return "만들지 못했어요. 잠시 뒤 다시 눌러주세요.";
}

 ["N","We'd like to remind you that our store will be closing in thirty minutes, at nine o'clock.","저희 매장이 30분 뒤인 9시에 문을 닫는다는 점을 알려드립니다."],
 ["N","Please bring your items to the checkout counters soon.","곧 계산대로 물건을 가져와 주세요."],
 ["N","Also, starting tomorrow, all fresh fruit and vegetables will be twenty percent off for the entire week.","또한 내일부터 일주일 동안 모든 신선 과일과 채소를 20% 할인합니다."],
 ["N","And don't forget to download our new mobile app, where you can find weekly coupons and track your reward points.","그리고 새 모바일 앱을 꼭 내려받으세요. 주간 쿠폰을 받고 적립 포인트도 확인할 수 있어요."],
 ["N","Thank you, and have a good evening.","감사합니다. 좋은 저녁 보내세요."]],
 qs:[{q:"Where is the announcement being made?",c:["At a supermarket","At a bank","At an airport","At a restaurant"],a:0,clue:0,ex:"'shoppers', 'Greenfield Market' → supermarket. 장소는 첫 문장에서 나와요."},
 {q:"What will happen tomorrow?",c:["The store will open late","Some products will be discounted","A new branch will open","Staff will be hired"],a:1,clue:3,ex:"'starting tomorrow... twenty percent off' → discounted."},
 {q:"According to the speaker, what can listeners do with the mobile app?",c:["Order groceries online","Check store hours","Get coupons","Contact staff"],a:2,clue:4,ex:"'find weekly coupons' → Get coupons."}]},
{part:4,lines:[
 ["N","Hi, this is Laura Chen from Bright Dental Clinic, calling for Mr. Kevin Park.","안녕하세요, 브라이트 치과의 로라 첸입니다. 케빈 박 님께 전화드렸어요."],
 ["N","I'm calling to remind you about your appointment tomorrow at ten thirty A.M.","내일 오전 10시 30분 예약을 다시 알려드리려고 전화했어요."],
 ["N","Unfortunately, Dr. Wilson will be out of the office tomorrow because of a family matter.","안타깝게도 윌슨 선생님이 집안일로 내일 자리에 안 계세요."],
 ["N","Dr. Lee can see you at the same time, or we can move your appointment to next Wednesday with Dr. Wilson.","같은 시간에 이 선생님께 진료받으시거나, 다음 주 수요일 윌슨 선생님으로 예약을 옮길 수 있어요."],
 ["N","Please call us back at 555-0142 before five o'clock today to let us know which you prefer.","어느 쪽이 좋으신지 오늘 5시 전에 555-0142로 다시 전화 주세요."],
 ["N","Thank you.","감사합니다."]],
 qs:[{q:"What is the purpose of the call?",c:["To discuss an appointment","To request a payment","To advertise a service","To introduce a new dentist"],a:0,clue:1,ex:"'I'm calling to remind you about your appointment' 목적은 I'm calling to~ 뒤에 나와요."},
 {q:"What problem does the speaker mention?",c:["The clinic is closed for repairs","A doctor is unavailable","A bill is incorrect","An address has changed"],a:1,clue:2,ex:"'Unfortunately, Dr. Wilson will be out of the office' → unavailable."},
 {q:"What is the listener asked to do?",c:["Arrive early","Fill out a form","Return a call","Visit a website"],a:2,clue:4,ex:"'Please call us back' → Return a call. 요청은 Please~ 뒤에 나와요."}]},
{part:4,lines:[
 ["N","Good morning, everyone, and welcome to the Hartwell Chocolate factory tour.","여러분 안녕하세요, 하트웰 초콜릿 공장 견학에 오신 걸 환영합니다."],
 ["N","My name is James, and I'll be your guide today. The tour will last about one hour.","저는 제임스이고 오늘 가이드를 맡았어요. 견학은 1시간 정도 걸려요."],
 ["N","First, we'll visit the area where we roast the cocoa beans, and then you'll see how our chocolate bars are wrapped.","먼저 카카오 콩을 볶는 곳에 가고, 그다음 초콜릿 바를 포장하는 과정을 보실 거예요."],
 ["N","Please note that taking photos is not allowed inside the production area, to protect our recipes.","제조법 보호를 위해 생산 구역 안에서는 사진 촬영이 금지돼 있어요."],
 ["N","At the end of the tour, you'll each receive a free box of chocolates in our gift shop.","견학이 끝나면 기념품 가게에서 한 분씩 초콜릿 한 상자를 무료로 받으세요."],
 ["N","Now, please follow me and put on the hairnets you received at the entrance.","이제 입구에서 받은 헤어캡을 쓰시고 저를 따라오세요."]],
 qs:[{q:"Who most likely is the speaker?",c:["A tour guide","A chef","A store manager","A photographer"],a:0,clue:1,ex:"'I'll be your guide today' 화자 신분은 앞부분에 나와요."},
 {q:"What are the listeners not allowed to do?",c:["Eat food","Take pictures","Touch machines","Leave the group"],a:1,clue:3,ex:"'taking photos is not allowed' → Take pictures."},
 {q:"What will the listeners receive at the end of the tour?",c:["A discount coupon","A recipe book","A free gift","A souvenir photo"],a:2,clue:4,ex:"'a free box of chocolates' → A free gift. 구체적인 말을 넓은 말로 바꿔요."}]}
].map((s,i)=>({...s,id:"l"+(i+1),lines:s.lines.map(([sp,t,ko])=>({sp,t,ko}))}));
const LSETS2=[{"id":"l7","part":3,"lines":[{"sp":"M","t":"Hello, I reserved a compact car for pickup this morning under the name Brian Lewis.","ko":"안녕하세요, 브라이언 루이스 이름으로 오늘 아침에 소형차를 받기로 예약했어요."},{"sp":"W","t":"Let me look that up, Mr. Lewis. I'm sorry, but all of our compact cars are out right now because several customers returned their vehicles late.","ko":"확인해볼게요, 루이스 씨. 죄송하지만 여러 고객이 차를 늦게 반납해서 지금 소형차가 하나도 없어요."},{"sp":"M","t":"That's a problem. I have a meeting with a client downtown at ten.","ko":"곤란하네요. 10시에 시내에서 고객과 회의가 있거든요."},{"sp":"W","t":"I can give you a midsize car for the same price. It's a little bigger, but it's ready to go now.","ko":"같은 가격에 중형차를 드릴 수 있어요. 조금 크지만 지금 바로 출발할 수 있어요."},{"sp":"M","t":"That works. Can I return it at the airport branch on Friday instead of here?","ko":"좋아요. 금요일에 여기 말고 공항 지점에 반납해도 되나요?"},{"sp":"W","t":"Of course. Just fill in the drop-off location on this form, and I'll get your keys.","ko":"물론이죠. 이 양식에 반납 장소만 적어주시면 열쇠를 가져올게요."}],"qs":[{"q":"Where most likely is the conversation taking place?","c":["At a car rental agency","At a hotel front desk","At an auto repair shop","At a travel agency"],"a":0,"clue":0,"ex":"'reserved a compact car for pickup' → 렌터카 업체. 장소는 첫 대사에서 나와요."},{"q":"Why are the compact cars unavailable?","c":["They are being cleaned","Some were returned late","A system error occurred","They were all sold"],"a":1,"clue":1,"ex":"'I'm sorry, but' 뒤가 이유: customers returned their vehicles late."},{"q":"What does the woman ask the man to do?","c":["Pay an extra fee","Show his license","Complete a form","Call the airport branch"],"a":2,"clue":5,"ex":"'fill in the drop-off location on this form' → Complete a form. (D) airport는 대화 단어를 그대로 쓴 함정."}]},{"id":"l8","part":3,"lines":[{"sp":"W","t":"Hi, this is Emily Santos returning a call from Ms. Grant about the graphic designer position.","ko":"안녕하세요, 그래픽 디자이너 자리 때문에 그랜트 씨가 주신 전화에 회신드리는 에밀리 산토스예요."},{"sp":"M","t":"Thanks for calling back, Ms. Santos. Ms. Grant was very impressed with your portfolio, and she'd like to invite you for an interview.","ko":"다시 전화 주셔서 감사해요, 산토스 씨. 그랜트 씨가 포트폴리오를 아주 인상 깊게 보셔서 면접에 초대하고 싶어 하세요."},{"sp":"W","t":"That's great news. When would she like to meet?","ko":"좋은 소식이네요. 언제 만나고 싶어 하세요?"},{"sp":"M","t":"She's available Thursday at two or Friday morning at nine.","ko":"목요일 2시나 금요일 아침 9시에 시간이 되세요."},{"sp":"W","t":"Thursday afternoon would be better for me. I'm finishing a project on Friday.","ko":"저는 목요일 오후가 좋아요. 금요일에 프로젝트를 마무리해야 해서요."},{"sp":"M","t":"All right. I'll e-mail you directions to our office. Please bring a copy of your recent work samples.","ko":"알겠어요. 사무실 오시는 길을 이메일로 보내드릴게요. 최근 작업물 사본을 가져와 주세요."}],"qs":[{"q":"Why is the woman calling?","c":["To return a call","To cancel an appointment","To order a product","To make a complaint"],"a":0,"clue":0,"ex":"'returning a call from Ms. Grant' → 회신 전화. 목적은 첫 문장."},{"q":"Why does the woman prefer Thursday?","c":["She will be traveling on Friday","She has to complete a project","The office is closed on Friday","She has another interview"],"a":1,"clue":4,"ex":"'I'm finishing a project on Friday' → complete a project."},{"q":"What does the man ask the woman to bring?","c":["Identification","A reference letter","Examples of her work","A signed contract"],"a":2,"clue":5,"ex":"'Please bring a copy of your recent work samples' → Examples of her work. 요청은 Please~ 뒤."}]},{"id":"l9","part":3,"lines":[{"sp":"M","t":"Sophie, have you heard that our department is moving to the fifth floor next month?","ko":"소피, 우리 부서가 다음 달에 5층으로 옮긴다는 얘기 들었어요?"},{"sp":"W","t":"Yes, I read the memo this morning. I'm glad, because the new space has a lot more natural light.","ko":"네, 오늘 아침에 공지 읽었어요. 새 공간은 햇빛이 훨씬 잘 들어서 좋아요."},{"sp":"M","t":"Me too. But I'm worried about packing everything. I have so many files in my office.","ko":"저도요. 그런데 짐 싸는 게 걱정이에요. 사무실에 파일이 엄청 많거든요."},{"sp":"W","t":"Actually, the memo said that a moving company will pack and transport all the boxes for us. We only need to label them.","ko":"사실 공지에 이삿짐 업체가 상자를 다 싸서 옮겨준대요. 우리는 상자에 이름표만 붙이면 돼요."},{"sp":"M","t":"Oh, that's a relief. Do you know when they'll give us the boxes?","ko":"아, 다행이네요. 상자는 언제 준대요?"},{"sp":"W","t":"I think the facilities manager is handing them out on Monday. I'll ask her to save some for you.","ko":"시설 관리자가 월요일에 나눠준대요. 당신 몫도 좀 남겨달라고 제가 말해둘게요."}],"qs":[{"q":"What are the speakers mainly discussing?","c":["A department relocation","A new manager","A building inspection","A company merger"],"a":0,"clue":0,"ex":"'our department is moving to the fifth floor' → relocation(이전)."},{"q":"What is the man concerned about?","c":["The cost of the move","The size of the new office","Packing his belongings","Losing some files"],"a":2,"clue":2,"ex":"'I'm worried about packing everything' → Packing his belongings. (D) files는 들린 단어를 이용한 함정."},{"q":"What does the woman offer to do?","c":["Help label some boxes","Speak to a manager","Read a memo","Contact a moving company"],"a":1,"clue":5,"ex":"'I'll ask her(the facilities manager)' → Speak to a manager. 제안은 마지막 I'll~."}]},{"id":"l10","part":3,"lines":[{"sp":"W","t":"Hi, this is Rachel from Bella Cucina restaurant. We received our weekly delivery this morning, but we got only half of the tomatoes we ordered.","ko":"안녕하세요, 벨라 쿠치나 레스토랑의 레이첼이에요. 오늘 아침 주간 배송을 받았는데 주문한 토마토가 절반밖에 안 왔어요."},{"sp":"M","t":"I'm very sorry about that, Rachel. It looks like our warehouse made a mistake when they were loading the truck.","ko":"정말 죄송해요, 레이첼. 창고에서 트럭에 싣다가 실수한 것 같아요."},{"sp":"W","t":"Well, we have a big catering event tonight, and we really need the rest of them by three o'clock.","ko":"오늘 밤에 큰 케이터링 행사가 있어서 나머지를 3시까지 꼭 받아야 해요."},{"sp":"M","t":"I understand. I'll send another driver with the missing items right away, and of course there will be no delivery charge.","ko":"알겠습니다. 빠진 물건을 다른 기사 편으로 바로 보내드릴게요. 배송비는 당연히 없어요."},{"sp":"W","t":"Thank you. That would be very helpful.","ko":"감사해요. 큰 도움이 될 거예요."},{"sp":"M","t":"I'll also give you a ten percent discount on next week's order for the trouble.","ko":"번거롭게 해드려서 다음 주 주문은 10% 할인해드릴게요."}],"qs":[{"q":"What problem does the woman mention?","c":["An order was incomplete","A delivery was late","Some items were damaged","A bill was incorrect"],"a":0,"clue":0,"ex":"'we got only half of the tomatoes we ordered' → 주문이 덜 옴(incomplete)."},{"q":"What does the woman say will happen tonight?","c":["A restaurant will open","A catering event will take place","A new menu will be introduced","A staff meeting will be held"],"a":1,"clue":2,"ex":"'we have a big catering event tonight'."},{"q":"What does the man offer?","c":["A full refund","A free meal","A discount on a future order","A new supplier"],"a":2,"clue":5,"ex":"'ten percent discount on next week's order' → future order."}]},{"id":"l11","part":4,"lines":[{"sp":"N","t":"Good morning, and thanks for listening to City Business Radio. I'm Paul Martin.","ko":"안녕하세요, 시티 비즈니스 라디오를 들어주셔서 감사합니다. 폴 마틴입니다."},{"sp":"N","t":"Our top story today: Horizon Electronics announced yesterday that it will open a new factory in Westfield next spring.","ko":"오늘의 주요 소식입니다. 호라이즌 전자가 어제 내년 봄 웨스트필드에 새 공장을 연다고 발표했습니다."},{"sp":"N","t":"The company says the factory will create about five hundred jobs for local residents.","ko":"회사는 이 공장이 지역 주민에게 약 500개의 일자리를 만들 거라고 밝혔습니다."},{"sp":"N","t":"Construction will begin in January, and the city has agreed to improve the roads around the site.","ko":"공사는 1월에 시작하고, 시는 부지 주변 도로를 개선하기로 했습니다."},{"sp":"N","t":"Horizon's president, Linda Cho, will hold a press conference this afternoon to answer questions about the project.","ko":"호라이즌의 린다 조 사장은 오늘 오후 기자회견을 열어 프로젝트에 대한 질문에 답할 예정입니다."},{"sp":"N","t":"Stay with us. After a short break, we'll have the latest traffic report.","ko":"채널 고정해주세요. 잠시 후 최신 교통 정보가 이어집니다."}],"qs":[{"q":"What is the broadcast mainly about?","c":["A new factory","A traffic accident","A company merger","A local election"],"a":0,"clue":1,"ex":"'will open a new factory in Westfield' 주요 소식(top story) 뒤에 주제가 나와요."},{"q":"According to the speaker, what has the city agreed to do?","c":["Lower some taxes","Improve some roads","Hire more workers","Build a new station"],"a":1,"clue":3,"ex":"'the city has agreed to improve the roads'."},{"q":"What will listeners hear next?","c":["A press conference","An interview","A traffic report","A weather forecast"],"a":2,"clue":5,"ex":"마지막 'we'll have the latest traffic report'. (A) 기자회견은 오후 일정이라 함정."}]},{"id":"l12","part":4,"lines":[{"sp":"N","t":"Before we finish today's meeting, I have one more announcement.","ko":"오늘 회의를 마치기 전에 공지가 하나 더 있어요."},{"sp":"N","t":"As many of you know, customers have been complaining that it takes too long to get a response from our support team.","ko":"다들 알다시피 고객들이 지원팀 답변을 받는 데 너무 오래 걸린다고 불만을 제기해왔어요."},{"sp":"N","t":"So, starting next week, we're introducing an online chat service on our Web site.","ko":"그래서 다음 주부터 웹사이트에 온라인 채팅 서비스를 도입해요."},{"sp":"N","t":"Customers will be able to talk to an agent directly, instead of sending an e-mail and waiting.","ko":"고객은 이메일을 보내고 기다리는 대신 상담원과 바로 대화할 수 있어요."},{"sp":"N","t":"To prepare, everyone on the team will attend a two-hour training session on Thursday.","ko":"준비를 위해 팀원 모두 목요일에 2시간짜리 교육을 받을 거예요."},{"sp":"N","t":"Please check your calendar and let Mark know by tomorrow if you can't make it.","ko":"일정을 확인하고, 참석이 어려우면 내일까지 마크에게 알려주세요."}],"qs":[{"q":"What problem does the speaker mention?","c":["Customers wait too long for responses","A Web site is not working","Sales have decreased","Some staff members have left"],"a":0,"clue":1,"ex":"'customers have been complaining that it takes too long to get a response'."},{"q":"What will the company introduce next week?","c":["A new product line","An online chat service","A customer survey","Longer business hours"],"a":1,"clue":2,"ex":"'starting next week, we're introducing an online chat service'."},{"q":"What are the listeners asked to do?","c":["Send an e-mail to customers","Update a calendar","Contact a coworker if unavailable","Prepare a presentation"],"a":2,"clue":5,"ex":"'let Mark know by tomorrow if you can't make it' → 못 오면 동료(Mark)에게 연락. (B) calendar는 함정."}]},{"id":"l13","part":4,"lines":[{"sp":"N","t":"Good afternoon, passengers. This is an announcement for Skyline Airways Flight 482 to Vancouver.","ko":"승객 여러분, 안녕하세요. 밴쿠버행 스카이라인 항공 482편 안내 말씀드립니다."},{"sp":"N","t":"Due to strong winds at our destination, this flight has been delayed by approximately ninety minutes.","ko":"목적지의 강풍으로 이 항공편은 약 90분 지연되었습니다."},{"sp":"N","t":"The new departure time is four fifteen P.M., and boarding will now take place at Gate 27 instead of Gate 12.","ko":"새 출발 시각은 오후 4시 15분이며, 탑승은 12번 게이트가 아닌 27번 게이트에서 진행됩니다."},{"sp":"N","t":"We apologize for the inconvenience. To thank you for your patience, each passenger will receive a meal voucher.","ko":"불편을 드려 죄송합니다. 기다려주셔서 감사한 마음으로 승객 모두에게 식사 쿠폰을 드립니다."},{"sp":"N","t":"Please show your boarding pass at the customer service desk near Gate 20 to receive your voucher.","ko":"20번 게이트 근처 고객 서비스 데스크에서 탑승권을 보여주시고 쿠폰을 받으세요."},{"sp":"N","t":"We will provide further updates as soon as they are available.","ko":"추가 소식이 있으면 바로 알려드리겠습니다."}],"qs":[{"q":"Why has the flight been delayed?","c":["Mechanical problems","Bad weather","A crew shortage","Heavy traffic"],"a":1,"clue":1,"ex":"'Due to strong winds' → Bad weather. 구체적인 말을 넓은 말로 바꿔요."},{"q":"What has changed besides the departure time?","c":["The boarding gate","The destination","The airline","The seat assignments"],"a":0,"clue":2,"ex":"'boarding will now take place at Gate 27 instead of Gate 12'."},{"q":"How can listeners get a voucher?","c":["By calling the airline","By visiting a Web site","By showing a boarding pass","By filling out a survey"],"a":2,"clue":4,"ex":"'Please show your boarding pass... to receive your voucher'."}]},{"id":"l14","part":4,"lines":[{"sp":"N","t":"Are you tired of spending hours cleaning your home every weekend?","ko":"주말마다 몇 시간씩 집 청소하는 게 지겨우신가요?"},{"sp":"N","t":"Then let Sparkle function buildLines(s){
  if(s.lines)return s.lines;
  const L4="ABCD",out=[];
  s.qs.forEach((q,i)=>{
    out.push({sp:"M",t:`Number ${i+1}.`});
    if(s.part===2){const qv=i%2?"W":"M",av=i%2?"M":"W";out.push({sp:qv,t:q.q});q.c.forEach((o,j)=>out.push({sp:av,t:`(${L4[j]}) ${o}`}));}
    else{const v=i%2?"M":"W";q.c.forEach((o,j)=>out.push({sp:v,t:`(${L4[j]}) ${o}`}));}
  });
  s.lines=out;return out;
}

const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|fred|junior|kathy|ralph|trinoids|whisper|zarvox|organ|superstar|wobble|jester|good news|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley|deranged|hysterical|pipe|princess|vicki|victoria|agnes|bruce/i;

const MAL=/\bmale|daniel|alex\b|david|guy|ryan|mark|george|aaron|thomas|oliver|arthur|rishi|james|matthew|joey|christopher|eric|evan|nathan|tom\b|noah|andrew|brian|roger|steffan|william|liam|google uk english male/i;
function voiceScore(v){
  const n=v.name;let s=0;
  if(NOVELTY.test(n))s-=1000;
  if(/natural|neural|online/i.test(n))s+=100;
  if(/premium/i.test(n))s+=90;
  if(/enhanced/i.test(n))s+=70;
  if(/google/i.test(n))s+=60;
  if(/siri/i.test(n))s+=50;
  if(/en[-_]US/i.test(v.lang))s+=10;else if(/en[-_](GB|AU|CA)/i.test(v.lang))s+=5;
  return s;
}
async function englishVoices(){return (await getVoices()).filter(v=>/^en[-_]/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));}
async function pickVoices(){
  if(VO)return VO;
  const all=await englishVoices();
  const byName=n=>n&&all.find(v=>v.name===n);
  const good=all.filter(v=>voiceScore(v)>-1000);
  const W=byName(S.voiceW)||good.find(v=>FEM.test(v.name)&&!/\bmale/i.test(v.name.replace(/female/i,"")))||good[0]||all[0]||null;
  const M=byName(S.voiceM)||good.find(v=>v!==W&&!/female/i.test(v.name)&&MAL.test(v.name))||good.find(v=>v!==W)||W;
  VO={W,M,same:!W||W===M,count:all.length};return VO;
}

async function speakLines(set,onLine,onDone){
  stopAudio();const my=++playToken;const vo=await pickVoices();
  const narr=(parseInt(String(set.id).replace(/\D/g,""),10)||0)%2?vo.W:vo.M;
  let accV={M:null,W:null};
  if(!/^(t0|hear)/.test(String(set.id))&&(S.accentMode||"mix")!=="us"){const m=setAccents(set,!!set.qs);const all=(await englishVoices()).filter(v=>voiceScore(v)>-1000);
    const pick=(acc,fem)=>{const pool=all.filter(v=>ACC_LANG[acc].test(v.lang));return pool.find(v=>fem?FEM.test(v.name):!FEM.test(v.name))||pool[0]||null;};
    if(!S.voiceM)accV.M=pick(m.accM,false);if(!S.voiceW)accV.W=pick(m.accW,true);}
  let i=0;
  const next=()=>{
    if(my!==playToken)return;
    if(i>=set.lines.length){onDone&&onDone();return;}
    const ln=set.lines[i],idx=i++;
    const u=new SpeechSynthesisUtterance(ln.t);u.lang="en-US";u.rate=S.rate||1;

}

async function genL(part){
  if(!sample||lgen.busy)return;
  lgen={busy:String(part),msg:""};render();
  const prompt=`토익 LC Part ${part} 실전 세트 1개를 새로 만들어줘. 대상: 목표 700점, 난이도 중.

보기는 대본 표현을 다른 말로 바꿔 쓴(paraphrase) 정답 + 대본 단어를 그대로 쓴 함정 오답 1개 이상. 정답이 정확히 하나만 되도록 검토.
clue는 그 문제의 단서가 나온 lines 배열의 인덱스(0부터).
JSON 객체만 출력: {"lines":[{"sp":"M|W|N","t":"영어 문장","ko":"자연스러운 한국어 해석"}],"qs":[{"q":"영어 질문","c":["보기1","보기2","보기3","보기4"],"a":정답 인덱스 0~3,"clue":숫자,"ex":"한국어 해설 1~2문장: 단서 표현과 정답이 어떻게 바꿔 말해졌는지"}]}`;
  try{
    const o=await sample.json(prompt,{modelTier:"default",cache:false});

      .map(q=>({q:q.q,c:q.c.map(String),a:+q.a,clue:Number.isInteger(+q.clue)?+q.clue:-1,ex:String(q.ex||"")}));
    if(lines.length<3||qs.length!==3)throw {code:"invalid_json"};
    const set={id:"lg"+Date.now().toString(36),part,lines,qs};

  render();
}

function mdLite(s){
  return esc(s).replace(/`([^`\n]+)`/g,"<b>$1</b>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#{1,4}\s*(.+)$/gm,"<b>$1</b>").replace(/^\s*[-*]\s+/gm,"• ").replace(/\n/g,"<br>");
}
function msgHtml(m,i){
  if(m.role==="user")return `<div class="msg user">${esc(m.content)}</div>`;
  const last=i===S.chat.length-1;
  const body=m.content?mdLite(m.content):(chatBusy&&last?`<span class="thinking"><span class="spin"></span>${esc(m.status||"생각하는 중…")}</span>`:"");
  const acts=(m.acts||[]).map((a,j)=>a.type==="p5"?`<button class="btn print" data-chatact="${i}-${j}">이 문제 ${a.n}개 풀기</button>`:`<button class="btn print" data-chatact="${i}-${j}">새 단어 ${a.n}개 퀴즈 하기</button>`).join("");
  return `<div class="msg bot"><div class="body">${body}</div>${m.err?`<div class="err">${esc(m.err)}</div>`:""}${acts?`<div class="acts">${acts}</div>`:""}</div>`;
}
function screenContext(){

  else if(tab==="p5"&&P)mode="Part 5 세트 리뷰 화면";
  else if(tab==="p5"&&RS)mode=RS.phase==="solve"?`Part ${RS.set.part} 세트를 푸는 중 (채점 전)`:`Part ${RS.set.part} 세트 리뷰 화면`;
  else if(tab==="lc"&&LL)mode=LL.phase==="review"?`LC Part ${LL.set.part} 세트 리뷰 화면 (스크립트 공개)`:`LC Part ${LL.set.part} 세트를 듣고 푸는 중 (채점 전, 스크립트 비공개)`;
  else if(tab==="voca"&&V)mode=V.picked==null&&V.idx<V.list.length?"단어 퀴즈를 푸는 중":"단어 퀴즈 결과/정답 공개";
  let txt="";try{txt=$("#main").innerText.replace(/\n{3,}/g,"\n\n").trim();}catch(e){}
  if(txt.length>7000)txt=txt.slice(0,7000)+"\n…(이하 생략)";
  return {tabName,mode,txt,solving:/푸는 중/.test(mode)};
}

function cleanQs(arr){
  return (Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.q==="string"&&/-{3,}/.test(x.q)&&Array.isArray(x.c)&&x.c.length===4&&Number.isInteger(+x.a)&&+x.a>=0&&+x.a<4)
    .map((x,i)=>({id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+i,q:x.q,c:x.c.map(String),a:+x.a,cat:String(x.cat||""),ex:String(x.ex||"")}));
}
async function sendChat(text){
  text=text.trim();if(!text||chatBusy||!sample)return;
  S.chat=S.chat||[];const sys=rules();if(!chatOpen)chatOpen=true;
  const hist=S.chat.filter(m=>m.content).slice(-16).map(m=>({role:m.role,content:m.content}));
  while(hist.length&&hist[0].role!=="user")hist.shift();
  S.chat.push({role:"user",content:text});
  const bot={role:"assistant",content:"",acts:[]};S.chat.push(bot);
  chatDraft="";const ta0=$("#chatin");if(ta0){ta0.value="";ta0.style.height="44px";}chatBusy=true;render();
  const turns=[{role:"user",content:sys},{role:"assistant",content:"알겠어요. 학생 진도를 참고해서 도와줄게요."},...hist,{role:"user",content:text}];
  const tools=[
    {name:"add_part5_questions",description:"앱의 Part 5 문제 은행에 새 문제를 추가하고, 답장 아래에 '풀기' 버튼을 만든다. 반환: 추가된 개수. 학생이 연습 문제를 원할 때 사용.",
     inputSchema:{type:"object",properties:{questions:{type:"array",items:{type:"object",properties:{q:{type:"string",description:"빈칸을 -------로 표시한 영어 문장"},c:{type:"array",items:{type:"string"},description:"보기 4개"},a:{type:"integer",description:"정답 인덱스 0~3"},cat:{type:"string",description:"유형 (한국어 2~6자)"},ex:{type:"string",description:"한국어 해설 1~2문장"}},required:["q","c","a","cat","ex"]}}},required:["questions"]},
     execute:(input)=>{const ok=cleanQs(input&&input.questions);if(!ok.length)throw new Error("형식이 맞는 문제가 없어요. q에 -------, 보기 4개, a는 0~3.");S.gen=(S.gen||[]).concat(ok);bot.acts.push({type:"p5",ids:ok.map(q=>q.id),n:ok.length});save();updateBubble();return {added:ok.length};}},
    {name:"add_words",description:"앱 단어장에 새 토익 단어를 추가하고 답장 아래에 '퀴즈 하기' 버튼을 만든다. 이미 있는 단어는 건너뛴다. 반환: 추가된 개수.",
     inputSchema:{type:"object",properties:{words:{type:"array",items:{type:"object",properties:{w:{type:"string",description:"영어 단어/표현"},m:{type:"string",description:"한국어 뜻(짧게)"},h:{type:"string",description:"자주 쓰이는 짧은 영어 표현"}},required:["w","m","h"]}}},required:["words"]},
     execute:(input)=>{const exist=new Set(allWords().map(w=>w.w.toLowerCase()));const ok=(Array.isArray(input&&input.words)?input.words:[]).filter(x=>x&&typeof x.w==="string"&&typeof x.m==="string"&&!exist.has(x.w.toLowerCase())).map(x=>({w:x.w,m:x.m,h:String(x.h||"")}));S.genW=(S.genW||[]).concat(ok);if(ok.length)bot.acts.push({type:"voca",n:ok.length});save();updateBubble();return {added:ok.length,skipped_existing:(input&&input.words||[]).length-ok.length};}}
  ];
  chatCtl=new AbortController();
  try{
    const r=await sample(turns,{modelTier:"default",cache:false,signal:chatCtl.signal,tools,onText:({text})=>{bot.content=text;updateBubble();}});
    bot.content=r.text;
  }catch(e){
    bot.content=e&&e.text||bot.content||"";
    if(!e||e.code!=="cancelled")bot.err=errMsg(e).replace("만들 수 없어요","채팅을 쓸 수 없어요").replace("만들지 못했어요","답을 받지 못했어요");
  }finally{

    save();render();
  }
}

  const vrf=e.target.closest("[data-vrf]");if(vrf&&V){V.filter=vrf.dataset.vrf;render();return;}
  if(e.target.closest("[data-act='vretry']")&&V){startVList(V.res.filter(r=>!r.ok).map(r=>r.w));return;}
  if(e.target.closest("[data-act='vhard']")){const hw=new Set(Object.entries(S.wst||{}).filter(([w,s])=>s.miss>=1).sort((a,b)=>b[1].miss-a[1].miss).slice(0,10).map(([w])=>w));startVList(allWords().filter(x=>hw.has(x.w)));return;}
  if(e.target.closest("[data-act='vai']")&&V){const ws=V.res.filter(r=>!r.ok).map(r=>r.w.w+" ("+r.w.m+")").join(", ");openChat();sendChat(`방금 단어 퀴즈에서 틀린 단어야: ${ws}\n단어마다 토익에 나올 법한 짧은 예문(해석 포함)과 헷갈리지 않게 외우는 요령을 한 줄씩 알려줘.`);return;}
  if(e.target.closest("[data-act='vlimit']")&&V&&V.picked==null){V.limit=V.limit?0:8;V.start=Date.now();render();return;}
  if(e.target.closest("[data-act='timedtoggle']")){S.timedOn=!S.timedOn;save();render();return;}
  const tsb=e.target.closest("[data-tsec]");if(tsb){S.timedP5=+tsb.dataset.tsec;save();render();return;}
  if(e.target.closest("[data-act='p5limit']")&&P&&P.picked==null){P.limit=P.limit?0:timedSec();P.start=Date.now();render();return;}
  if(e.target.closest("[data-act='rclimit']")&&RS&&RS.phase==="solve"){RS.limitOn=!RS.limitOn;if(RS.limitOn&&(Date.now()-RS.start)/1000>=rcTarget(RS.set)-10)RS.start=Date.now()-Math.max(0,(rcTarget(RS.set)-60))*1000;render();return;}
  const acb=e.target.closest("[data-acc]");if(acb){S.accentMode=acb.dataset.acc;save();render();return;}
  if(e.target.closest("[data-act='audclear']")){Promise.all([...AUD].map(id=>delAudio(id))).then(()=>{S.audMeta={};save();render();});return;}
  const rt=e.target.closest("[data-rate]");if(rt){S.rate=+rt.dataset.rate;save();render();return;}
  const la=e.target.closest("[data-act^='lc'],[data-act^='lgen']");
  if(la){const a=la.dataset.act;
    if(/^lc[1-4]$/.test(a)){copyBox=null;startSet(nextSet(+a.slice(2)));}
    else if(a==="lcresume"){if(LL&&LL.audio){LL.blocked=false;render();curAudio=LL.audio;LL.audio.play().catch(()=>{LL.blocked=true;render();});}}
    else if(a==="lcplay")lcPlay();
    else if(a==="lcskip")lcReview();
    else if(a==="lchome"){if(LL)clearInterval(LL.timer);stopAudio();LL=null;render();}
    else if(a==="lcreplay")lcReplay();
    else if(a==="lcstop"){stopAudio();if(LL){LL.replaying=false;LL.line=-1;}render();}
    else if(a==="lcko"){showKo=!showKo;render();}
    else if(a==="lctest")voiceTest();
    else if(/^lgen[1-4]$/.test(a)){const pt=+a.slice(4);pt<=2?genL12(pt):genL(pt);}
    return;}
  const cs=e.target.closest("[data-act='chatstop'],[data-act='chatclear']");
  if(cs){if(cs.dataset.act==="chatstop")chatCtl&&chatCtl.abort();else{S.chat=[];save();render();}return;}
  const p=e.target.closest("[data-pick]");if(p){answer(+p.dataset.pick);return;}
  const vp=e.target.closest("[data-vpick]");if(vp){vAnswer(+vp.dataset.vpick);return;}
  const vf=e.target.closest("[data-vf]");if(vf){vFilter=vf.dataset.vf;render();return;}
  const a=e.target.closest("[data-act]");if(!a)return;
  switch(a.dataset.act){
    case "p5new":if(tab!=="p5"){tab="p5";}startP5(pickNew(10));break;
    case "p5wrong":{const ids=p5WrongIds();tab="p5";try{history.replaceState(null,"","#p5");}catch(_){}startP5(shuffle(allQs().filter(q=>ids.includes(q.id))).slice(0,10));break;}
    case "p5next":nextQ();break;
    case "p5home":P=null;clearInterval(window._t);render();break;
    case "genq":genQ();break;
    case "genw":genW();break;
    case "vstart":startV();window.scrollTo({top:0});break;
    case "vnext":vNext();break;
    case "vdunno":vAnswer(-1);break;
    case "vhome":V=null;render();break;
  }
  window.scrollTo({top:Math.min(window.scrollY,0)});
});


/* iOS 웹뷰에서 탭이 클릭으로 안 바뀌는 경우 대비: 터치 후 클릭이 안 오면 직접 클릭 */
(function(){let pend=null;
  document.addEventListener("pointerup",e=>{if(e.pointerType!=="touch")return;const el=e.target.closest&&e.target.closest("button,label");if(!el||el.disabled)return;
    clearTimeout(pend);pend=setTimeout(()=>{pend=null;if(document.body.contains(el)&&!el.disabled)el.click();},420);},true);
  document.addEventListener("click",()=>{if(pend){clearTimeout(pend);pend=null;}},true);
  document.addEventListener("pointercancel",()=>{if(pend){clearTimeout(pend);pend=null;}},true);
})();
render();
</script>
