<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>토익 700 트레이너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: Apple-style grouped layout — light gray canvas, white rounded cards, system type, one blue accent; big bold numerals carry the hierarchy */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#F2F2F7; --line:#E5E5EA; --ink:#1D1D1F; --muted:#6E6E73;
  --primary:#0071E3; --primary-ink:#FFFFFF; --primary-soft:#E8F1FC;
  --hl:#FFD60A; --hl-soft:rgba(255,214,10,.32);
  --ok:#248A3D; --ok-soft:#E8F5EB; --bad:#D70015; --bad-soft:#FCEBEC;
  --shadow:0 1px 2px rgba(0,0,0,.03);
  --print:var(--primary); --rule:var(--line); --paper:var(--surface-2); --sheet:var(--surface); --print-soft:var(--primary-soft); --graphite:var(--ink); --on-graphite:var(--surface);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  --f-mono:var(--f-display);
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#38383A; --ink:#F5F5F7; --muted:#98989D;
  --primary:#0A84FF; --primary-ink:#FFFFFF; --primary-soft:#0A2A4D;
  --hl:#FFD60A; --hl-soft:rgba(255,214,10,.22);
  --ok:#30D158; --ok-soft:#10291A; --bad:#FF453A; --bad-soft:#331513;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --line:#38383A; --ink:#F5F5F7; --muted:#98989D;
  --primary:#0A84FF; --primary-ink:#FFFFFF; --primary-soft:#0A2A4D;
  --hl:#FFD60A; --hl-soft:rgba(255,214,10,.22);
  --ok:#30D158; --ok-soft:#10291A; --bad:#FF453A; --bad-soft:#331513;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 80px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 45%,transparent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
a{color:var(--primary);text-decoration:none}

/* hero */
header.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-block:44px 28px;flex-wrap:wrap}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted)}
header.hero h1{margin:4px 0 8px;font-family:var(--f-display);font-weight:700;font-size:clamp(32px,7vw,44px);line-height:1.08;letter-spacing:-.035em;text-wrap:balance}
.goal{font-size:15px;color:var(--muted)}
.goal .num{color:var(--ink);font-weight:600}
.goal .arrow{margin:0 4px}
.dday{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.dd-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.dday .big{font-family:var(--f-display);font-weight:700;font-size:clamp(48px,11vw,72px);letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--ink)}

/* tabs: segmented control */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:3px;border-radius:12px;
  background:color-mix(in srgb,var(--surface-2) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;border:none;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 1px rgba(0,0,0,.04)}
nav.tabs .badge{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}

main{padding-top:24px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.03em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.02em;margin:0}
.label{font-size:13px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.sheet{background:var(--surface);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;background:var(--primary);color:var(--primary-ink);padding:11px 20px;border-radius:980px;font-weight:600;font-size:15px;transition:filter .15s,background .15s,transform .1s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.ghost{background:var(--surface-2);color:var(--primary)}
.btn.ghost:hover:not(:disabled){filter:brightness(.97)}
.btn.print{background:var(--primary);color:var(--primary-ink)}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);letter-spacing:-.005em}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stats > div{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.stats .v{font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.stats .k{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.35}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

/* schedule */
.days{display:flex;flex-direction:column;gap:12px}
.day{background:var(--surface);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow);border:2px solid transparent}
.day.today{border-color:var(--primary)}
.day.past{opacity:.5}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.day-h .tag{font-size:12px;font-weight:600;color:var(--primary-ink);background:var(--primary);padding:3px 10px;border-radius:980px}
.check{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer;border-top:1px solid var(--line)}
.day-h + .check{border-top:none}
.check input{appearance:none;flex:0 0 22px;width:22px;height:22px;margin-top:1px;border:1.5px solid #C7C7CC;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:transparent;transition:background .15s,border-color .15s}
.check input:checked{background:var(--primary);border-color:var(--primary)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.where{font-size:12px;font-weight:600;padding:1px 8px;border-radius:980px;margin-left:6px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.where.here{background:var(--primary-soft);color:var(--primary)}

.mock{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px 12px;align-items:center}
.mock input,.sheet select{width:100%;max-width:120px;padding:10px 12px;border:none;border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.sheet select{max-width:100%;font-size:14px}
#gkeyin{border:none!important;background:var(--surface-2)!important;border-radius:10px!important}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--primary);border-radius:2px;transition:width .3s}
.qno{font-weight:600;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.cat{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:3px 10px;border-radius:980px}
.qtext{font-family:var(--f-display);font-size:21px;line-height:1.6;margin:22px 0;font-weight:600;letter-spacing:-.02em}
.qtext .blank{display:inline-block;min-width:80px;height:1.1em;vertical-align:-.18em;border-bottom:2px solid var(--primary);margin:0 3px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);padding:13px 16px;border-radius:14px;font-size:16px;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt:disabled{cursor:default}
.bub{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--surface-2);color:var(--muted)}
.opt.picked{border-color:var(--primary);background:var(--primary-soft)}
.opt.picked .bub{background:var(--primary);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);color:#fff}
.feedback{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--ok-soft);font-size:15px}
.feedback.no{background:var(--bad-soft)}
.feedback b{display:block;margin-bottom:3px;color:var(--ok)}
.feedback.no b{color:var(--bad)}
.timer{font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer.slow{color:var(--bad)}
.result-big{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.word-big{font-family:var(--f-display);font-size:40px;font-weight:700;margin:16px 0 2px;letter-spacing:-.04em}

/* lists */
.list{display:flex;flex-direction:column}
.li{padding:13px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.wl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.wl .h{grid-column:1/-1;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.known{background:var(--ok)} .dot.weak{background:var(--bad)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:0}
.seg button{border:none;background:none;padding:5px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* review */
.rv-top{display:flex;align-items:center;gap:28px;margin-top:10px;flex-wrap:wrap}
.rv-kpis{display:flex;flex-direction:column;gap:8px;flex:1;min-width:220px}
.rv-kpis > div{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rv-kpis > div:last-child{border-bottom:none;padding-bottom:0}
.rv-kpis b{font-size:18px;font-weight:700;min-width:64px;letter-spacing:-.02em}
.rv-kpis span{font-size:14px;color:var(--muted)}
.rv-kpis b.bad,.bad{color:var(--bad)}
.okc{color:var(--ok)}
.catlist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.catrow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.5em;gap:12px;align-items:center;font-size:15px}
.catrow > span:last-child{text-align:right}
.bar{display:block;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.coach{margin:10px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.coach li{padding:12px 14px;background:var(--surface-2);border-radius:12px;font-size:15px;line-height:1.55}
.coach li b{display:block;font-size:13px;color:var(--primary);margin-bottom:2px}
.rv{padding:18px 0;border-top:1px solid var(--line)}
.rv:first-of-type{margin-top:8px}
.rv-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:980px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.rv-q{font-size:17px;font-weight:500;line-height:1.6;margin:10px 0}
.fill{font-weight:700;color:var(--ok);border-bottom:2px solid var(--ok);padding:0 2px}
.rv-opts{display:flex;flex-wrap:wrap;gap:6px}
.rv-o{font-size:13px;padding:4px 11px;border-radius:980px;background:var(--surface-2);color:var(--muted)}
.rv-o.right{background:var(--ok-soft);color:var(--ok);font-weight:600}
.rv-o.wrong{background:var(--bad-soft);color:var(--bad)}
.rv-ex{margin:10px 0 6px;font-size:15px;color:var(--ink)}
.link{border:none;background:none;color:var(--primary);font-weight:600;padding:0;font-size:14px}
.link::after{content:" ›"}

/* tips */
details.tip{background:var(--surface);border-radius:var(--r);padding:0 22px;box-shadow:var(--shadow)}
details.tip summary{cursor:pointer;padding:18px 0;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px;letter-spacing:-.02em}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"";width:8px;height:8px;margin-top:6px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;flex:0 0 auto}
details.tip[open] summary::after{transform:rotate(-135deg);margin-top:10px}
details.tip ul{margin:0 0 18px;padding-left:20px}
details.tip li{margin:7px 0}
.kbd{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;background:var(--surface-2);padding:1px 7px;border-radius:6px}
table.t{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:14px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
.tablewrap{overflow-x:auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--muted);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 15px;border-radius:20px;line-height:1.5;overflow-wrap:anywhere;min-width:0}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--surface)}
.msg .acts{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.msg .acts .btn{padding:8px 14px;font-size:14px}
.msg .err{color:var(--bad);font-size:13px;margin-top:6px}
.msg .thinking{color:var(--muted)}
.composer{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;height:44px;max-height:140px;padding:10px 16px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);font:inherit;line-height:1.5}
.composer .btn{height:44px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:none;background:var(--surface-2);color:var(--primary);border-radius:980px;padding:8px 14px;font-size:14px;font-weight:500}
.chip:hover{background:var(--primary-soft)}

/* listening */
.lq{display:flex;flex-direction:column;gap:8px;padding:18px 0;border-top:1px solid var(--line)}
.lq:first-of-type{border-top:none}
.lq .qt{font-weight:600;letter-spacing:-.02em}
.lq .opt{padding:10px 14px;font-size:15px}
.lq .bub{flex-basis:26px;height:26px;font-size:12px}
.phase{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--surface-2);margin:16px 0 4px;flex-wrap:wrap;font-size:15px}
.phase .count{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--primary);min-width:2.5ch;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:18px}
.eq i{width:3px;background:var(--primary);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.script{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.sl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:9px 10px;border-radius:12px}
.sl .sp{font-size:13px;font-weight:600;color:var(--muted);padding-top:1px}
.sl.clue{background:var(--hl-soft)}
.sl.now{box-shadow:inset 0 0 0 2px var(--primary)}
.sl .ko{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.sl .ct{display:inline-block;font-size:11px;font-weight:700;color:#1D1D1F;background:var(--hl);border-radius:980px;padding:1px 8px;margin-left:6px;white-space:nowrap;vertical-align:1px}
@media (prefers-reduced-motion:reduce){.spin,.eq i{animation:none}.eq i{height:10px}.progress i,.btn,.opt,nav.tabs button{transition:none}}
</style>

<div class="wrap">
  <header class="hero">
    <div><span class="eyebrow">TOEIC · 11월 15일 (일)</span><h1>토익 700 트레이너</h1>

<script>
/* ---------- content ---------- */
const BANK=[

{q:"The manager ------- the proposal before the meeting started.",c:["review","reviewing","had reviewed","has been reviewed"],a:2,cat:"시제",ex:"회의 시작(과거)보다 더 먼저 일어난 일이라 과거완료 had reviewed."},
{q:"All employees are required to ------- with the new safety regulations.",c:["comply","follow","obey","observe"],a:0,cat:"어휘",ex:"빈칸 뒤 with와 짝이 되는 건 comply with(준수하다). follow, obey, observe는 with 없이 바로 목적어가 와요."},

async function gfetch(model,body,signal){
  let last;
  for(let i=0;i<3;i++){
    let r;
    try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":gkey()},body:JSON.stringify(body),signal});}
    catch(e){if(e&&e.name==="AbortError")throw {code:"cancelled"};last={code:"network"};await new Promise(r=>setTimeout(r,1500*(i+1)));continue;}
    const d=await r.json().catch(()=>({}));
    if(r.ok)return d;
    const msg=d.error&&d.error.message||"";
    if(r.status===400&&/api key/i.test(msg)||r.status===401||r.status===403)throw {code:"bad_key",message:msg};
    if(r.status===429)throw {code:"rate_limited",message:msg};
    if(r.status===404)throw {code:"no_model",message:msg};
    if(r.status>=500){last={code:"unavailable",message:msg};await new Promise(r=>setTimeout(r,2000*(i+1)));continue;}
    throw {code:"error",message:msg};
  }
  throw last||{code:"unavailable"};
}
const TEXT_MODELS=["gemini-3.5-flash","gemini-flash-latest"];

}
function makeGeminiSample(){
  const fn=async(input,opts={})=>{
    const msgs=typeof input==="string"?[{role:"user",content:input}]:input;
    const contents=msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
    const tools=opts.tools||[];const body={contents};
    if(tools.length)body.tools=[{functionDeclarations:tools.map(t=>({name:t.name,description:t.description,parameters:t.inputSchema||{type:"object",properties:{}}}))}];
    for(let round=0;round<6;round++){
      const d=await gtext(body,opts.signal);
      const parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
      const calls=parts.filter(p=>p.functionCall);
      if(!calls.length){const text=parts.filter(p=>!p.thought).map(p=>p.text||"").join("");opts.onText&&opts.onText({text,delta:text});return {text,truncated:false};}
      contents.push({role:"model",parts});
      const resp=[];
      for(const c of calls){const t=tools.find(x=>x.name===c.functionCall.name);let out;
        try{out=t?await t.execute(c.functionCall.args||{}):{error:"unknown tool"};}catch(e){out={error:String(e&&e.message||e)};}
        resp.push({functionResponse:{name:c.functionCall.name,response:{result:out}}});}
      contents.push({role:"user",parts:resp});
    }
    throw {code:"unavailable"};
  };
  fn.json=async(input,opts={})=>{
    const d=await gtext({contents:[{role:"user",parts:[{text:input}]}],generationConfig:{responseMimeType:"application/json"}},opts.signal);
    const text=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||"").join("");
    try{return JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g,""));}catch(e){throw {code:"invalid_json",text};}
  };
  return fn;
}
/* Google 음성(TTS): PCM → WAV */
function pcmToWav(bytes,rate=24000){
  const buf=new ArrayBuffer(44+bytes.length),v=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF");v.setUint32(4,36+bytes.length,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,bytes.length,true);
  new Uint8Array(buf,44).set(bytes);return new Blob([buf],{type:"audio/wav"});
}

const GV_M=["Charon","Puck","Fenrir","Orus","Iapetus","Algenib","Alnilam"],GV_W=["Kore","Aoede","Leda","Zephyr","Callirrhoe","Autonoe","Despina"];
function hashId(id){let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h);}
const ttsPending={};
function geminiTTS(set){
  if(ttsPending[set.id])return ttsPending[set.id];
  const h=hashId(set.id),vm=GV_M[h%GV_M.length],vw=GV_W[(h>>3)%GV_W.length];
  const multi={multiSpeakerVoiceConfig:{speakerVoiceConfigs:[
        {speaker:"Man",voiceConfig:{prebuiltVoiceConfig:{voiceName:vm}}},{speaker:"Woman",voiceConfig:{prebuiltVoiceConfig:{voiceName:vw}}}]}};
  const bodyFor=fmt=>set.part===3
    ?(fmt==="new"
      ?{contents:[{role:"user",parts:set.lines.map(l=>({text:l.t,speechMetadata:{speaker:l.sp==="M"?"Man":"Woman"}}))}],generationConfig:{responseModalities:["AUDIO"],speechConfig:multi}}
      :{contents:[{role:"user",parts:[{text:"TTS the following TOEIC listening conversation between Man and Woman, natural exam pace:\n"+set.lines.map(l=>(l.sp==="M"?"Man: ":"Woman: ")+l.t).join("\n")}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:multi}})
    :{contents:[{role:"user",parts:[{text:set.lines.map(l=>l.t).join(" ")}]}],
      generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:(h%2?vw:vm)}}}}};
  /* 무료 사용량은 모델마다 따로라서, 막히면 다음 모델로 */
  const CHAIN=[["gemini-3.8-flash-tts","new"],["gemini-3.8-flash-lite-tts","new"],["gemini-3.1-flash-tts-preview","old"],["gemini-2.5-flash-preview-tts","old"]];
  const tryChain=async()=>{let err;for(const [m,f] of CHAIN){try{return await gfetch(m,bodyFor(f));}catch(e){err=e;if(e.code==="bad_key")throw e;}}throw err;};
  const p=tryChain().then(async d=>{
    const parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
    const chunks=parts.filter(x=>x.inlineData).map(x=>Uint8Array.from(atob(x.inlineData.data),c=>c.charCodeAt(0)));
    if(!chunks.length)throw {code:"error",message:"no audio"};
    const all=new Uint8Array(chunks.reduce((a,c)=>a+c.length,0));let o=0;chunks.forEach(c=>{all.set(c,o);o+=c.length;});
    await putAudio(set.id,pcmToWav(all));return true;
  }).finally(()=>{delete ttsPending[set.id];});
  ttsPending[set.id]=p;return p;
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const L="ABCD";
const allQs=()=>BANK.concat(S.gen||[]);
const allWords=()=>{const seen=new Set();return WORDS.concat(S.genW||[]).filter(x=>!seen.has(x.w)&&seen.add(x.w));};
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dday(){const t=new Date();t.setHours(0,0,0,0);const e=new Date(2026,10,15);const n=Math.round((e-t)/864e5);return n>0?"D-"+n:n===0?"D-DAY":"끝!";}
const blankify=q=>esc(q).replace(/-{3,}/,'<span class="blank"></span>');

/* ---------- tabs ---------- */
const TABS=[["today","오늘"],["chat",window.claude?"Claude에게 묻기":"AI에게 묻기"],["lc","Part 3·4"],["p5","Part 5"],["voca","단어"],["tips","파트별 팁"],["wrong","오답노트"]];
let tab="today";
try{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h;}catch(e){}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)){tab=h;render();}});
function go(t){tab=t;try{history.replaceState(null,"","#"+t);}catch(e){}render();window.scrollTo({top:0});}

function renderTabs(){
  const wc=Object.keys(S.wrong).length;
  $("#tabs").innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${n}${k==="wrong"&&wc?`<span class="badge num">${wc}</span>`:""}</button>`).join("");
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)go(b.dataset.tab);});

function render(){
  $("#dday").textContent=dday();
  renderTabs();
  if(tab!=="lc"&&LL&&LL.phase!=="review"){clearInterval(LL.timer);stopAudio();LL=null;}
  if(tab!=="lc"&&LL&&LL.replaying){stopAudio();LL.replaying=false;LL.line=-1;}
  ({today:rToday,chat:rChat,lc:rLC,p5:rP5,voca:rVoca,tips:rTips,wrong:rWrong})[tab]();
}

/* ---------- today ---------- */
function rToday(){
  const tk=todayKey();
  const st=S.st,acc=st.n?Math.round(st.c/st.n*100):null,avg=st.n?Math.round(st.sec/st.n):null;
  const known=allWords().filter(w=>S.words[w.w]==="known").length;
  const m=S.mock||{};
  $("#main").innerHTML=`${STANDALONE&&!gkey()?keyBox():""}
  <div class="stats">
    <div><div class="v">${acc==null?"–":acc+"%"}</div><div class="k">Part 5 정답률 (${st.n}문제)</div></div>
    <div><div class="v ${avg>20?"":""}">${avg==null?"–":avg+"초"}</div><div class="k">문제당 평균 (목표 20초)</div></div>
    <div><div class="v">${known}<span class="muted" style="font-size:14px">/${allWords().length}</span></div><div class="k">아는 단어</div></div>
    <div><div class="v">${Object.keys(S.wrong).length}</div><div class="k">오답노트</div></div>
  </div>
  <section class="days">
    <div class="row" style="justify-content:space-between"><h2>6일 계획</h2><span class="note"><span class="where here">여기</span> 이 페이지에서 · <span class="where">책/앱</span> 리스닝·모의고사</span></div>
    ${PLAN.map(p=>{const cls=p.d===tk?"today":p.d<tk?"past":"";const [y,mo,da]=p.d.split("-");
      return `<div class="day ${cls}"><div class="day-h"><h3><span class="num">${+mo}/${+da}</span> (${p.t})${p.exam?" 시험날":""}</h3>${p.d===tk?'<span class="tag">오늘</span>':""}</div>
      ${p.items.map(([txt,w],i)=>{const id=p.d+"-"+i;return `<label class="check"><input type="checkbox" id="c-${id}" data-check="${id}" ${S.checks[id]?"checked":""}><span>${esc(txt)} <span class="where ${w==="여기"?"here":""}">${w}</span></span></label>`;}).join("")}</div>`;}).join("")}
  </section>
  <section class="sheet">
    <h2>모의고사 기록</h2>
    <p class="note" style="margin:4px 0 12px">각 100문제 중 맞은 개수. 참고용 대략치로 LC 75개, RC 68개 이상이면 700점 근처예요.</p>
    <div class="mock">
      <span></span><span class="label">LC 정답</span><span class="label">RC 정답</span>
      ${["1","2"].map(n=>`<span>${n}회</span><input id="m${n}lc" inputmode="numeric" data-mock="${n}lc" value="${esc(m[n+"lc"]??"")}" placeholder="0–100"><input id="m${n}rc" inputmode="numeric" data-mock="${n}rc" value="${esc(m[n+"rc"]??"")}" placeholder="0–100">`).join("")}
    </div>
    ${mockAdvice(m)}
  </section>`;
}
function mockAdvice(m){
  const lc=+m["1lc"],rc=+m["1rc"];
  if(!m["1lc"]||!m["1rc"])return `<p class="note" style="margin:12px 0 0">1회 기록을 넣으면 어디에 집중할지 알려드려요.</p>`;
  const tips=[];
  if(lc<75)tips.push("LC가 목표보다 낮아요. 남은 날 Part 2를 매일 50문제씩 하세요. 가장 빨리 오르는 LC 파트예요.");
  if(rc<68)tips.push("RC가 목표보다 낮아요. 여기서 Part 5를 하루 30문제 이상 풀고, 문제당 20초 안에 끝내는 연습을 하세요.");
  if(!tips.length)tips.push("둘 다 목표 근처예요. 실수만 줄이면 돼요. 오답노트와 '몰라요' 단어 위주로 복습하세요.");
  return `<div class="feedback" style="margin-top:14px">${tips.map(esc).join("<br>")}</div>`;
}
$("#main").addEventListener("change",e=>{
  const au=e.target.dataset.aud;if(au){const f=e.target.files&&e.target.files[0];if(!f)return;
    if(!/^audio\//.test(f.type)&&!/\.(wav|mp3|m4a|ogg|aac)$/i.test(f.name)){audMsg="음성 파일(wav, mp3 등)만 넣을 수 있어요.";render();return;}
    putAudio(au,f).then(()=>{const s=allSets().find(x=>x.id===au);audMsg=(s?setLabel(s):"세트")+"에 Google 음성을 넣었어요.";copyBox=null;render();}).catch(()=>{audMsg="저장하지 못했어요. 브라우저 저장 공간이나 시크릿 모드를 확인해주세요.";render();});return;}
  const vk=e.target.dataset.voice;if(vk){S["voice"+vk]=e.target.value;VO=null;save();voiceTest();return;}
  const c=e.target.dataset.check;if(c){S.checks[c]=e.target.checked;save();}
  const mk=e.target.dataset.mock;if(mk){S.mock=S.mock||{};S.mock[mk]=e.target.value.replace(/\D/g,"").slice(0,3);save();render();}
});

/* ---------- Part 5 ---------- */
let P=null; // {list,idx,picked,start,res:[],timer}
function startP5(list){P={list,idx:0,picked:null,start:Date.now(),res:[]};tick();render();}
function tick(){clearInterval(window._t);window._t=setInterval(()=>{const el=$("#qtimer");if(!el||!P||P.picked!=null)return;const s=Math.floor((Date.now()-P.start)/1000);el.textContent=s+"초";el.classList.toggle("slow",s>20);},500);}
function pickNew(n){
  const qs=allQs(),seen=S.seen||{};
  const unseen=shuffle(qs.filter(q=>!seen[q.id])),rest=shuffle(qs.filter(q=>seen[q.id]));
  return unseen.concat(rest).slice(0,n);
}
let genState={busy:false,msg:""};
function rP5(){
  if(!P){
    const qs=allQs(),seen=S.seen||{},left=qs.filter(q=>!seen[q.id]).length;
    $("#main").innerHTML=`<section class="sheet">
      <span class="label">Part 5 · 단문 빈칸 채우기</span>
      <h2 style="margin-top:4px">10문제씩 풀어요</h2>
      <p class="muted" style="margin:6px 0 14px">고르면 바로 정답과 해설이 나와요. 틀린 문제는 오답노트에 자동으로 저장돼요. 실전에선 문제당 <b>20초</b>가 목표예요.</p>
      <div class="row">
        <button class="btn print" data-act="p5new">10문제 시작</button>
        ${Object.keys(S.wrong).length?`<button class="btn ghost" data-act="p5wrong">오답만 다시 (${Object.keys(S.wrong).length})</button>`:""}
      </div>
      <p class="note" style="margin:12px 0 0">문제 은행 <span class="num">${qs.length}</span>개 · 아직 안 푼 문제 <span class="num">${left}</span>개</p>
    </section>
    ${genBox("p5")}`;
    return;
  }
  if(P.idx>=P.list.length){p5Review();return;}
  const q=P.list[P.idx],done=P.picked!=null;
  $("#main").innerHTML=`<section class="sheet">
    <div class="qhead"><span class="qno">${P.idx+1} / ${P.list.length}</span><span class="row" style="gap:8px">${done&&q.cat?`<span class="cat">${esc(q.cat)}</span>`:""}<span class="timer" id="qtimer">${done?P.res[P.res.length-1].sec+"초":"0초"}</span></span></div>
    <div class="progress"><i style="width:${P.idx/P.list.length*100}%"></i></div>
    <p class="qtext">${blankify(q.q)}</p>
    <div class="opts">${q.c.map((o,i)=>{let cls="";if(done){if(i===q.a)cls="right";else if(i===P.picked)cls="wrong";}
      return `<button class="opt ${cls}" data-pick="${i}" ${done?"disabled":""}><span class="bub">${L[i]}</span><span>${esc(o)}</span></button>`;}).join("")}</div>
    ${done?`<div class="feedback ${P.picked===q.a?"":"no"}"><b>${P.picked===q.a?"정답!":"정답은 ("+L[q.a]+") "+esc(q.c[q.a])}</b>${esc(q.ex||"")}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn ghost" data-act="p5home">그만하기</button><button class="btn" data-act="p5next" id="nextbtn">${P.idx+1<P.list.length?"다음 문제":"결과 보기"}</button></div>`:`<p class="note" style="margin:12px 0 0">키보드 1–4 또는 A–D로도 고를 수 있어요.</p>`}
  </section>`;
  if(done)$("#nextbtn")?.focus();
}
function answer(i){
  if(!P||P.picked!=null||P.idx>=P.list.length)return;
  const q=P.list[P.idx],sec=Math.round((Date.now()-P.start)/1000),ok=i===q.a;
  P.picked=i;P.res.push({q,ok,sec,pick:i});
  S.st.n++;S.st.c+=ok?1:0;S.st.sec+=Math.min(sec,120);
  S.catSt=S.catSt||{};const ck=q.cat||"기타";S.catSt[ck]=S.catSt[ck]||{n:0,c:0};S.catSt[ck].n++;S.catSt[ck].c+=ok?1:0;
  S.seen=S.seen||{};S.seen[q.id]=1;
  if(ok)delete S.wrong[q.id];else S.wrong[q.id]=(S.wrong[q.id]||0)+1;
  save();render();
}
function nextQ(){P.idx++;P.picked=null;P.start=Date.now();render();}

/* ---------- Part 5 세트 리뷰 ---------- */
const CAT_TIPS=[
  [/전치사\s*vs|접속사/,"빈칸 뒤를 먼저 보세요. 명사만 있으면 전치사(despite, due to), 주어+동사가 있으면 접속사(although, because)예요."],
  [/전치사/,"짝으로 외우세요: by(마감)/until(계속), within+기간, since+시점, between A and B, prior to."],
  [/품사/,"해석하지 말고 빈칸 앞뒤만: 명사 앞 → 형용사, 동사·형용사 수식 → 부사, 관사·전치사 뒤 → 명사."],
  [/시제/,"시간 단서를 찾으세요: since/for → 현재완료, by the time+과거 → 과거완료, if·when 절은 미래 대신 현재."],
  [/수일치/,"주어를 찾아 단수/복수 확인. each of, every는 단수, 관계대명사 who/that은 앞 명사에 맞춰요."],
  [/어휘|collocation|표현/,"빈칸 바로 뒤 전치사가 힌트예요: comply with, apply for, be responsible for. 표현째로 외우세요."],
  [/비교/,"비교급 강조는 much/even/far/still, the+최상급, as ~ as 원급. very는 비교급을 못 꾸며요."],
  [/관계/,"선행사가 사람/사물인지, 빈칸 뒤에 주어나 목적어가 빠졌는지 보세요. 뒤가 완전하면 whose나 관계부사."],
  [/가정법|도치/,"Should/Had/Were로 시작하면 If가 생략된 도치예요. Should you have questions = If you should have questions."],
  [/상관/,"짝 찾기: neither-nor, either-or, both-and, not only-but also."],
  [/동사\s*원형|원형|요구/,"ask, request, suggest, require that 뒤에는 동사원형(should 생략). 수동이면 be p.p."],
  [/태|수동/,"빈칸 뒤에 목적어가 있으면 능동, 없으면 수동(be p.p.)."]
];
function tipFor(cat){const t=CAT_TIPS.find(([re])=>re.test(cat||""));return t?t[1]:"해설을 다시 읽고 핵심 단서가 문장 어디에 있었는지 표시해보세요.";}
function bar(c,n){const p=n?Math.round(c/n*100):0;return `<span class="bar"><i style="width:${p}%;background:${p>=80?"var(--ok)":p>=50?"var(--primary)":"var(--bad)"}"></i></span>`;}
function p5Review(){
  const R=P.res,n=R.length,c=R.filter(r=>r.ok).length,avg=Math.round(R.reduce((a,r)=>a+r.sec,0)/n);
  const slow=R.filter(r=>r.sec>20),wrong=R.filter(r=>!r.ok);
  const overall=S.st.n?Math.round(S.st.c/S.st.n*100):null;
  const by={};R.forEach(r=>{const k=r.q.cat||"기타";by[k]=by[k]||{n:0,c:0,sec:0};by[k].n++;by[k].c+=r.ok?1:0;by[k].sec+=r.sec;});
  const cats=Object.entries(by).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n||b[1].n-a[1].n);
  const weak=cats.filter(([k,v])=>v.c<v.n).map(([k])=>k);
  const cum=Object.entries(S.catSt||{}).filter(([k,v])=>v.n>=3).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).slice(0,3);
  const coach=[];
  weak.slice(0,3).forEach(k=>coach.push(`<li><b>${esc(k)}</b> ${esc(tipFor(k))}</li>`));
  if(avg>20)coach.push(`<li><b>속도</b> 평균 ${avg}초로 목표(20초)보다 느려요. 보기부터 보고, 품사 문제는 5초 안에 끝내세요.</li>`);
  else if(slow.length)coach.push(`<li><b>시간</b> 20초 넘긴 문제 ${slow.length}개 (${esc([...new Set(slow.map(r=>r.q.cat||"기타"))].join(", "))}). 실전에서는 10초 넘으면 찍고 넘어가세요.</li>`);
  if(!wrong.length)coach.push(`<li><b>완벽해요</b> 이 유형들은 실전에서 빠르게 풀고, 아낀 시간을 Part 7에 쓰세요.</li>`);
  const f=P.filter||"all";
  const items=R.map((r,i)=>({r,i})).filter(({r})=>f==="wrong"?!r.ok:f==="slow"?r.sec>20:true);
  $("#main").innerHTML=`
  <section class="sheet">
    <span class="label">세트 리뷰</span>
    <div class="rv-top">
      <div><div class="result-big">${c}<span class="muted" style="font-size:.5em">/${n}</span></div></div>
      <div class="rv-kpis">
        <div><b class="num">${Math.round(c/n*100)}%</b><span>이번 정답률${overall!=null?` · 누적 ${overall}%`:""}</span></div>
        <div><b class="num ${avg>20?"bad":""}">${avg}초</b><span>문제당 평균 · 목표 20초</span></div>
        <div><b class="num">${slow.length}개</b><span>20초 넘긴 문제</span></div>
      </div>
    </div>
  </section>
  <section class="sheet">
    <h3>유형별 결과</h3>
    <div class="catlist">${cats.map(([k,v])=>`<div class="catrow"><span>${esc(k)}</span>${bar(v.c,v.n)}<span class="num muted">${v.c}/${v.n}</span></div>`).join("")}</div>
    ${cum.length?`<p class="note" style="margin:14px 0 6px">지금까지 기록으로 본 약한 유형</p><div class="catlist">${cum.map(([k,v])=>`<div class="catrow"><span>${esc(k)}</span>${bar(v.c,v.n)}<span class="num muted">${Math.round(v.c/v.n*100)}%</span></div>`).join("")}</div>`:""}
  </section>
  <section class="sheet">
    <h3>코칭</h3>
    <ul class="coach">${coach.join("")}</ul>
    <div class="row" style="margin-top:14px">
      ${wrong.length?`<button class="btn print" data-act="p5retry">틀린 ${wrong.length}문제 다시 풀기</button>`:""}
      ${sample&&weak.length?`<button class="btn ghost" data-act="p5genweak" ${genState.busy?"disabled":""}>${genState.busy?'<span class="spin"></span>만드는 중…':"약한 유형으로 새 문제 10개"}</button>`:""}
    </div>
    ${genState.msg?`<p class="note" style="margin:8px 0 0">${esc(genState.msg)}</p>`:""}
  </section>
  <section class="sheet">
    <div class="row" style="justify-content:space-between"><h3>문제 다시 보기</h3>
      <div class="seg">${[["all","전체"],["wrong","틀린 문제"],["slow","느린 문제"]].map(([k,t])=>`<button data-rf="${k}" aria-pressed="${f===k}">${t}</button>`).join("")}</div></div>
    ${items.length?items.map(({r,i})=>{const q=r.q;
      const filled=esc(q.q).replace(/-{3,}/,`<span class="fill">${esc(q.c[q.a])}</span>`);
      return `<article class="rv">
        <div class="rv-h"><span class="qno">${i+1}번</span><span class="pill ${r.ok?"ok":"bad"}">${r.ok?"맞음":"틀림"}</span><span class="timer ${r.sec>20?"slow":""}">${r.sec}초</span>${q.cat?`<span class="cat">${esc(q.cat)}</span>`:""}</div>
        <p class="rv-q">${filled}</p>
        <div class="rv-opts">${q.c.map((o,j)=>`<span class="rv-o ${j===q.a?"right":j===r.pick?"wrong":""}">${L[j]}. ${esc(o)}${j===r.pick&&!r.ok?" · 내 답":""}</span>`).join("")}</div>
        <p class="rv-ex">${esc(q.ex||"")}</p>
        ${sample?`<button class="link" data-askq="${i}">이 문제 더 물어보기</button>`:""}
      </article>`;}).join(""):`<p class="note" style="margin:12px 0 0">해당하는 문제가 없어요.</p>`}
  </section>
  <div class="row"><button class="btn print" data-act="p5new">새 10문제</button><button class="btn ghost" data-act="p5home">처음으로</button></div>`;
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  const k=e.key.toUpperCase();
  if(tab==="p5"&&P&&P.picked==null){const i="1234".indexOf(k)>=0?"1234".indexOf(k):"ABCD".indexOf(k);if(i>=0&&k.length===1){answer(i);e.preventDefault();}}
  else if(tab==="voca"&&V&&V.picked==null){const i="1234".indexOf(k);if(i>=0&&k.length===1){vAnswer(i);e.preventDefault();}}
});

/* ---------- AI generation ---------- */
function genBox(kind){
  if(!sample)return "";
  const isP=kind==="p5";
  return `<section class="sheet">
    <span class="label">문제가 더 필요할 때</span>
    <h3 style="margin-top:4px">${isP?"Claude가 새 Part 5 문제 10개 만들기":"Claude가 새 토익 단어 20개 추가"}</h3>

async function genQ(focus){
  genState={busy:true,msg:""};render();
  const mix=focus&&focus.length?`이 유형 위주로 만들어줘(학생이 방금 틀린 유형): ${focus.join(", ")}. 유형 이름(cat)도 이 이름을 그대로 써.`:"유형을 고르게 섞어: 품사 자리, 동사 시제·태·수일치, 전치사 vs 접속사, 관계사, 어휘(함께 쓰이는 표현).";
  const prompt=`토익 Part 5(단문 빈칸 채우기) 실전 문제 10개를 새로 만들어줘. 대상: 목표 700점 수험생, 난이도 중~중상.
${mix}
규칙: 실제 토익처럼 비즈니스 상황 문장. 빈칸은 "-------"로 표시. 보기 4개 중 정답이 정확히 하나만 되도록 스스로 검토할 것.
해설은 한국어로 1~2문장, 왜 그게 답인지 핵심 단서를 짚어줘.
JSON 배열만 출력: [{"q":"문장","c":["보기1","보기2","보기3","보기4"],"a":정답 인덱스(0~3),"cat":"유형(한국어 2~6자)","ex":"해설"}]`;
  try{
    const arr=await sample.json(prompt,{modelTier:"default",cache:false});
    const ok=(Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.q==="string"&&/-{3,}/.test(x.q)&&Array.isArray(x.c)&&x.c.length===4&&Number.isInteger(x.a)&&x.a>=0&&x.a<4)
      .map((x,i)=>({id:"g"+Date.now().toString(36)+i,q:x.q,c:x.c.map(String),a:x.a,cat:String(x.cat||""),ex:String(x.ex||"")}));
    if(!ok.length)throw {code:"invalid_json"};
    S.gen=(S.gen||[]).concat(ok);save();
    genState={busy:false,msg:ok.length+"문제 추가됐어요."};
    startP5(ok);return;
  }catch(e){genState={busy:false,msg:errMsg(e)};}
  render();
}
async function genW(){
  genState={busy:true,msg:""};render();
  const have=allWords().map(w=>w.w).join(", ");
  const prompt=`토익에 자주 나오는 단어·표현 20개를 골라줘. 목표 700점 수험생용. 다음 목록에 있는 건 제외: ${have}
JSON 배열만 출력: [{"w":"영어 단어/표현","m":"한국어 뜻 (짧게, 15자 이내)","h":"토익에 자주 나오는 짧은 영어 표현 예시"}]`;
  try{
    const arr=await sample.json(prompt,{modelTier:"default",cache:false});
    const exist=new Set(allWords().map(w=>w.w.toLowerCase()));
    const ok=(Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.w==="string"&&typeof x.m==="string"&&!exist.has(x.w.toLowerCase())).map(x=>({w:x.w,m:x.m,h:String(x.h||"")}));
    if(!ok.length)throw {code:"invalid_json"};
    S.genW=(S.genW||[]).concat(ok);save();
    genState={busy:false,msg:ok.length+"개 추가됐어요. 퀴즈에 먼저 나와요."};
  }catch(e){genState={busy:false,msg:errMsg(e)};}
  render();
}
function errMsg(e){
  const c=e&&e.code;
  if(c==="not_granted"){sample=null;return "허용하지 않아서 만들 수 없어요. 기본 문제로 계속 공부하면 돼요.";}
  if(c==="bad_key")return "Google API 키가 맞지 않아요. 키를 다시 확인해주세요.";
  if(c==="network")return "인터넷 연결을 확인해주세요.";
  if(c==="rate_limited")return "요청이 많아요. 1분쯤 뒤에 다시 눌러주세요.";
  if(c==="invalid_json")return "결과가 이상하게 나왔어요. 다시 한 번 눌러주세요.";
  return "만들지 못했어요. 잠시 뒤 다시 눌러주세요.";
}

let V=null; // {list,idx,opts,picked}
let vFilter="all";
function startV(){
  const ws=allWords();
  const weak=shuffle(ws.filter(w=>S.words[w.w]==="weak")),unseen=shuffle(ws.filter(w=>!S.words[w.w])),known=shuffle(ws.filter(w=>S.words[w.w]==="known"));
  const list=weak.slice(0,4).concat(unseen).concat(weak.slice(4)).concat(known).slice(0,10);
  V={list,idx:0,picked:null,res:[]};mkOpts();render();
}
function mkOpts(){
  const w=V.list[V.idx];if(!w)return;
  const others=shuffle(allWords().filter(x=>x.w!==w.w&&x.m!==w.m)).slice(0,3).map(x=>x.m);
  V.opts=shuffle([w.m,...others]);
}

function vAnswer(i){
  if(!V||V.picked!=null)return;
  const w=V.list[V.idx],ok=i>=0&&V.opts[i]===w.m;
  V.picked=i;V.res.push(ok);S.words[w.w]=ok?"known":"weak";save();render();
}

 ["W","That sounds even better. Is there an extra charge for the private room?","그게 더 좋겠네요. 별실은 추가 요금이 있나요?"],

 ["W","Perfect. Let me give you my e-mail address.","좋아요. 제 이메일 주소를 알려드릴게요."]],

 {q:"What problem does the man mention?",c:["A room is being renovated","The main dining room is full","The restaurant closes early","A chef is unavailable"],a:1,clue:2,ex:"'I'm afraid' 뒤가 문제점: main dining room is fully booked → full."},

{part:3,lines:[
 ["W","Daniel, are you going to the training session on the new accounting software tomorrow?","대니얼, 내일 새 회계 소프트웨어 교육에 가요?"],
 ["M","I was planning to, but my manager just asked me to visit a client in Chicago. I won't be back until Friday.","가려고 했는데 매니저가 방금 시카고에 있는 고객을 방문하라고 해서요. 금요일에나 돌아와요."],
 ["W","That's too bad. The session is required for everyone in our department.","아쉽네요. 그 교육은 우리 부서 전원 필수인데요."],

 ["W","Actually, the trainer is holding a second session next Monday. You should sign up for that one so you can ask questions.","사실 강사가 다음 주 월요일에 한 번 더 해요. 질문도 할 수 있게 그걸 신청하세요."],
 ["M","Thanks. I'll register for it on the website this afternoon.","고마워요. 오늘 오후에 웹사이트에서 등록할게요."]],

 {q:"Why is the man unable to attend tomorrow?",c:["He will be traveling for work","He is feeling sick","He has a job interview","He is moving offices"],a:0,clue:1,ex:"'visit a client in Chicago' → traveling for work. 그대로 들리는 단어가 아니라 바꿔 말한 보기를 골라야 해요."},
 {q:"What does the woman suggest the man do?",c:["Watch a recording","Speak to his manager","Attend a later session","Contact the trainer"],a:2,clue:4,ex:"'You should sign up for that one(second session)'. (A) 영상은 남자가 한 말이라 함정이에요."}]},
{part:4,lines:[
 ["N","Attention, shoppers. Thank you for visiting Greenfield Market.","쇼핑객 여러분, 안내 말씀드립니다. 그린필드 마켓을 찾아주셔서 감사합니다."],
 ["N","We'd like to remind you that our store will be closing in thirty minutes, at nine o'clock.","저희 매장이 30분 뒤인 9시에 문을 닫는다는 점을 알려드립니다."],
 ["N","Please bring your items to the checkout counters soon.","곧 계산대로 물건을 가져와 주세요."],
 ["N","Also, starting tomorrow, all fresh fruit and vegetables will be twenty percent off for the entire week.","또한 내일부터 일주일 동안 모든 신선 과일과 채소를 20% 할인합니다."],
 ["N","And don't forget to download our new mobile app, where you can find weekly coupons and track your reward points.","그리고 새 모바일 앱을 꼭 내려받으세요. 주간 쿠폰을 받고 적립 포인트도 확인할 수 있어요."],
 ["N","Thank you, and have a good evening.","감사합니다. 좋은 저녁 보내세요."]],
 qs:[{q:"Where is the announcement being made?",c:["At a supermarket","At a bank","At an airport","At a restaurant"],a:0,clue:0,ex:"'shoppers', 'Greenfield Market' → supermarket. 장소는 첫 문장에서 나와요."},
 {q:"What will happen tomorrow?",c:["The store will open late","Some products will be discounted","A new branch will open","Staff will be hired"],a:1,clue:3,ex:"'starting tomorrow... twenty percent off' → discounted."},
 {q:"According to the speaker, what can listeners do with the mobile app?",c:["Order groceries online","Check store hours","Get coupons","Contact staff"],a:2,clue:4,ex:"'find weekly coupons' → Get coupons."}]},
{part:4,lines:[
 ["N","Hi, this is Laura Chen from Bright Dental Clinic, calling for Mr. Kevin Park.","안녕하세요, 브라이트 치과의 로라 첸입니다. 케빈 박 님께 전화드렸어요."],

 ["N","Unfortunately, Dr. Wilson will be out of the office tomorrow because of a family matter.","안타깝게도 윌슨 선생님이 집안일로 내일 자리에 안 계세요."],
 ["N","Dr. Lee can see you at the same time, or we can move your appointment to next Wednesday with Dr. Wilson.","같은 시간에 이 선생님께 진료받으시거나, 다음 주 수요일 윌슨 선생님으로 예약을 옮길 수 있어요."],
 ["N","Please call us back at 555-0142 before five o'clock today to let us know which you prefer.","어느 쪽이 좋으신지 오늘 5시 전에 555-0142로 다시 전화 주세요."],
 ["N","Thank you.","감사합니다."]],
 qs:[{q:"What is the purpose of the call?",c:["To discuss an appointment","To request a payment","To advertise a service","To introduce a new dentist"],a:0,clue:1,ex:"'I'm calling to remind you about your appointment' 목적은 I'm calling to~ 뒤에 나와요."},
 {q:"What problem does the speaker mention?",c:["The clinic is closed for repairs","A doctor is unavailable","A bill is incorrect","An address has changed"],a:1,clue:2,ex:"'Unfortunately, Dr. Wilson will be out of the office' → unavailable."},
 {q:"What is the listener asked to do?",c:["Arrive early","Fill out a form","Return a call","Visit a website"],a:2,clue:4,ex:"'Please call us back' → Return a call. 요청은 Please~ 뒤에 나와요."}]},
{part:4,lines:[
 ["N","Good morning, everyone, and welcome to the Hartwell Chocolate factory tour.","여러분 안녕하세요, 하트웰 초콜릿 공장 견학에 오신 걸 환영합니다."],
 ["N","My name is James, and I'll be your guide today. The tour will last about one hour.","저는 제임스이고 오늘 가이드를 맡았어요. 견학은 1시간 정도 걸려요."],
 ["N","First, we'll visit the area where we roast the cocoa beans, and then you'll see how our chocolate bars are wrapped.","먼저 카카오 콩을 볶는 곳에 가고, 그다음 초콜릿 바를 포장하는 과정을 보실 거예요."],
 ["N","Please note that taking photos is not allowed inside the production area, to protect our recipes.","제조법 보호를 위해 생산 구역 안에서는 사진 촬영이 금지돼 있어요."],
 ["N","At the end of the tour, you'll each receive a free box of chocolates in our gift shop.","견학이 끝나면 기념품 가게에서 한 분씩 초콜릿 한 상자를 무료로 받으세요."],
 ["N","Now, please follow me and put on the hairnets you received at the entrance.","이제 입구에서 받은 헤어캡을 쓰시고 저를 따라오세요."]],
 qs:[{q:"Who most likely is the speaker?",c:["A tour guide","A chef","A store manager","A photographer"],a:0,clue:1,ex:"'I'll be your guide today' 화자 신분은 앞부분에 나와요."},

 {q:"What will the listeners receive at the end of the tour?",c:["A discount coupon","A recipe book","A free gift","A souvenir photo"],a:2,clue:4,ex:"'a free box of chocolates' → A free gift. 구체적인 말을 넓은 말로 바꿔요."}]}

const LSETS2=[{"id":"l7","part":3,"lines":[{"sp":"M","t":"Hello, I reserved a compact car for pickup this morning under the name Brian Lewis.","ko":"안녕하세요, 브라이언 루이스 이름으로 오늘 아침에 소형차를 받기로 예약했어요."},{"sp":"W","t":"Let me look that up, Mr. Lewis. I'm sorry, but all of our compact cars are out right now because several customers returned their vehicles late.","ko":"확인해볼게요, 루이스 씨. 죄송하지만 여러 고객이 차를 늦게 반납해서 지금 소형차가 하나도 없어요."},{"sp":"M","t":"That's a problem. I have a meeting with a client downtown at ten.","ko":"곤란하네요. 10시에 시내에서 고객과 회의가 있거든요."},{"sp":"W","t":"I can give you a midsize car for the same price. It's a little bigger, but it's ready to go now.","ko":"같은 가격에 중형차를 드릴 수 있어요. 조금 크지만 지금 바로 출발할 수 있어요."},{"sp":"M","t":"That works. Can I return it at the airport branch on Friday instead of here?","ko":"좋아요. 금요일에 여기 말고 공항 지점에 반납해도 되나요?"},{"sp":"W","t":"Of course. Just fill in the drop-off location on this form, and I'll get your keys.","ko":"물론이죠. 이 양식에 반납 장소만 적어주시면 열쇠를 가져올게요."}],"qs":[{"q":"Where most likely is the conversation taking place?","c":["At a car rental agency","At a hotel front desk","At an auto repair shop","At a travel agency"],"a":0,"clue":0,"ex":"'reserved a compact car for pickup' → 렌터카 업체. 장소는 첫 대사에서 나와요."},{"q":"Why are the compact cars unavailable?","c":["They are being cleaned","Some were returned late","A system error occurred","They were all sold"],"a":1,"clue":1,"ex":"'I'm sorry, but' 뒤가 이유: customers returned their vehicles late."},{"q":"What does the woman ask the man to do?","c":["Pay an extra fee","Show his license","Complete a form","Call the airport branch"],"a":2,"clue":5,"ex":"'fill in the drop-off location on this form' → Complete a form. (D) airport는 대화 단어를 그대로 쓴 함정."}]},{"id":"l8","part":3,"lines":[{"sp":"W","t":"Hi, this is Emily Santos returning a call from Ms. Grant about the graphic designer position.","ko":"안녕하세요, 그래픽 디자이너 자리 때문에 그랜트 씨가 주신 전화에 회신드리는 에밀리 산토스예요."},{"sp":"M","t":"Thanks for calling back, Ms. Santos. Ms. Grant was very impressed with your portfolio, and she'd like to invite you for an interview.","ko":"다시 전화 주셔서 감사해요, 산토스 씨. 그랜트 씨가 포트폴리오를 아주 인상 깊게 보셔서 면접에 초대하고 싶어 하세요."},{"sp":"W","t":"That's great news. When would she like to meet?","ko":"좋은 소식이네요. 언제 만나고 싶어 하세요?"},{"sp":"M","t":"She's available Thursday at two or Friday morning at nine.","ko":"목요일 2시나 금요일 아침 9시에 시간이 되세요."},{"sp":"W","t":"Thursday afternoon would be better for me. I'm finishing a project on Friday.","ko":"저는 목요일 오후가 좋아요. 금요일에 프로젝트를 마무리해야 해서요."},{"sp":"M","t":"All right. I'll e-mail you directions to our office. Please bring a copy of your recent work samples.","ko":"알겠어요. 사무실 오시는 길을 이메일로 보내드릴게요. 최근 작업물 사본을 가져와 주세요."}],"qs":[{"q":"Why is the woman calling?","c":["To return a call","To cancel an appointment","To order a product","To make a complaint"],"a":0,"clue":0,"ex":"'returning a call from Ms. Grant' → 회신 전화. 목적은 첫 문장."},{"q":"Why does the woman prefer Thursday?","c":["She will be traveling on Friday","She has to complete a project","The office is closed on Friday","She has another interview"],"a":1,"clue":4,"ex":"'I'm finishing a project on Friday' → complete a project."},{"q":"What does the man ask the woman to bring?","c":["Identification","A reference letter","Examples of her work","A signed contract"],"a":2,"clue":5,"ex":"'Please bring a copy of your recent work samples' → Examples of her work. 요청은 Please~ 뒤."}]},{"id":"l9","part":3,"lines":[{"sp":"M","t":"Sophie, have you heard that our department is moving to the fifth floor next month?","ko":"소피, 우리 부서가 다음 달에 5층으로 옮긴다는 얘기 들었어요?"},{"sp":"W","t":"Yes, I read the memo this morning. I'm glad, because the new space has a lot more natural light.","ko":"네, 오늘 아침에 공지 읽었어요. 새 공간은 햇빛이 훨씬 잘 들어서 좋아요."},{"sp":"M","t":"Me too. But I'm worried about packing everything. I have so many files in my office.","ko":"저도요. 그런데 짐 싸는 게 걱정이에요. 사무실에 파일이 엄청 많거든요."},{"sp":"W","t":"Actually, the memo said that a moving company will pack and transport all the boxes for us. We only nee async function genL(part){
  if(!sample||lgen.busy)return;
  lgen={busy:String(part),msg:""};render();
  const prompt=`토익 LC Part ${part} 실전 세트 1개를 새로 만들어줘. 대상: 목표 700점, 난이도 중.
${part===3?"남녀 2명의 비즈니스 대화(sp는 M 또는 W), 5~7턴, 한 턴은 1~2문장.":"한 사람의 담화(sp는 모두 N): 안내 방송, 음성 메시지, 회의 발췌, 광고, 라디오 방송, 투어 안내 중 하나. 6~8문장, 한 줄에 한 문장."}
문제 3개: 실제 토익처럼 1번은 주제·목적·장소·화자 신분(앞부분 단서), 2번은 세부 사항(중간), 3번은 다음 할 일·요청·제안(끝부분).
보기는 대본 표현을 다른 말로 바꿔 쓴(paraphrase) 정답 + 대본 단어를 그대로 쓴 함정 오답 1개 이상. 정답이 정확히 하나만 되도록 검토.
clue는 그 문제의 단서가 나온 lines 배열의 인덱스(0부터).
JSON 객체만 출력: {"lines":[{"sp":"M|W|N","t":"영어 문장","ko":"자연스러운 한국어 해석"}],"qs":[{"q":"영어 질문","c":["보기1","보기2","보기3","보기4"],"a":정답 인덱스 0~3,"clue":숫자,"ex":"한국어 해설 1~2문장: 단서 표현과 정답이 어떻게 바꿔 말해졌는지"}]}`;
  try{
    const o=await sample.json(prompt,{modelTier:"default",cache:false});
    const lines=(o&&Array.isArray(o.lines)?o.lines:[]).filter(l=>l&&typeof l.t==="string").map(l=>({sp:["M","W","N"].includes(l.sp)?l.sp:(part===4?"N":"M"),t:l.t,ko:String(l.ko||"")}));
    const qs=(o&&Array.isArray(o.qs)?o.qs:[]).filter(q=>q&&typeof q.q==="string"&&Array.isArray(q.c)&&q.c.length===4&&Number.isInteger(+q.a)&&+q.a>=0&&+q.a<4)
      .map(q=>({q:q.q,c:q.c.map(String),a:+q.a,clue:Number.isInteger(+q.clue)?+q.clue:-1,ex:String(q.ex||"")}));
    if(lines.length<3||qs.length!==3)throw {code:"invalid_json"};
    const set={id:"lg"+Date.now().toString(36),part,lines,qs};
    S.genL=(S.genL||[]).concat(set);save();
    lgen={busy:false,msg:""};startSet(set);return;
  }catch(e){lgen={busy:false,msg:errMsg(e)};}
  render();
}

    `단어: 아는 단어 ${known}개, 몰라요 ${weak.length}개${weak.length?" → "+weak.slice(0,30).join(", "):""}`,
    `모의고사: 1회 LC ${m["1lc"]||"-"} / RC ${m["1rc"]||"-"}, 2회 LC ${m["2lc"]||"-"} / RC ${m["2rc"]||"-"} (각 100문제 중 정답 수)`,
    `앱 듣기 연습: Part 3 ${(S.lc&&S.lc.p3)?S.lc.p3.c+"/"+S.lc.p3.n:"기록 없음"}, Part 4 ${(S.lc&&S.lc.p4)?S.lc.p4.c+"/"+S.lc.p4.n:"기록 없음"}`,
    p?`오늘 할 일: `+p.items.map(([t],i)=>(S.checks[p.d+"-"+i]?"[완료] ":"[ ] ")+t).join(" / "):"오늘은 계획표에 없는 날"
  ];
  return lines.join("\n");
}
function rules(){
  return `너는 토익 시험을 앞둔 학생을 돕는 토익 튜터야. 이 대화는 '토익 700 트레이너' 앱 안의 채팅 탭이야.
학생 정보: 시험 2026-11-15(일). 목표 700점 이상. 최고 기록 690점(10개월 전). 파트별 팁을 많이 잊었고 단어를 잘 모른다고 함.
오늘: ${todayKey()} (시험 ${dday()}).
앱에 기록된 현재 진도:
${progressSummary()}

규칙:
- 한국어 해요체로, 짧고 친근하게. 핵심만 말하고 긴 내용은 목록으로.
- 앱 구성: 오늘(6일 일정 체크리스트·모의고사 기록), Part 5(문제 풀이), 단어(4지선다 퀴즈·단어장), 파트별 팁, 오답노트.
- 학생이 연습 문제나 단어를 원하면 대화창에 문제를 길게 쓰지 말고 도구로 앱에 추가해. 추가하면 '풀기' 버튼이 답장 아래 자동으로 생기니까, 답장에는 몇 개를 어떤 유형으로 넣었는지만 짧게 말해. 정답은 답장에 쓰지 마.
- Part 5 문제 형식: 실제 토익처럼 비즈니스 문장, 빈칸은 "-------", 보기 4개, 정답이 정확히 하나만 되도록 스스로 검토, 해설은 한국어 1~2문장.
- 학생이 문제 하나를 붙여넣고 물어보면 그건 대화창에서 바로 설명해줘.
- 'Part 3·4' 탭에서 브라우저 음성(TTS)으로 듣기 세트를 풀 수 있어(기계 음성). 그 탭에서 Claude가 새 세트도 만들 수 있다고 안내해. 실전 음원 연습은 책이나 토익 앱을 같이 쓰라고 해.
- 학생의 실제 모의고사(기출 TEST 4) 결과: 150/200 (LC 77, RC 73). P1 5/6, P2 21/25, P3 30/39, P4 21/30, P5 25/30, P6 13/16, P7 35/54. P4 72~78번을 연달아 틀림(마킹 실수가 아니라 실제로 틀린 것). 186~200번은 시간 부족으로 찍음. 우선순위: P3·P4에서 들으면서 바로 풀고 다음 세트 미리 읽기, RC는 P7 시작할 때 55분 남기기.
- 점수 환산처럼 확실하지 않은 건 대략치라고 말해.`;
}
function mdLite(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#{1,4}\s*(.+)$/gm,"<b>$1</b>").replace(/^\s*[-*]\s+/gm,"• ").replace(/\n/g,"<br>");
}
function msgHtml(m,i){
  if(m.role==="user")return `<div class="msg user">${esc(m.content)}</div>`;
  const last=i===S.chat.length-1;
  const body=m.content?mdLite(m.content):(chatBusy&&last?`<span class="thinking"><span class="spin"></span>${esc(m.status||"생각하는 중…")}</span>`:"");
  const acts=(m.acts||[]).map((a,j)=>a.type==="p5"?`<button class="btn print" data-chatact="${i}-${j}">이 문제 ${a.n}개 풀기</button>`:`<button class="btn print" data-chatact="${i}-${j}">새 단어 ${a.n}개 퀴즈 하기</button>`).join("");
  return `<div class="msg bot"><div class="body">${body}</div>${m.err?`<div class="err">${esc(m.err)}</div>`:""}${acts?`<div class="acts">${acts}</div>`:""}</div>`;
}
function rChat(){
  S.chat=S.chat||[];
  if(!sample){
    $("#main").innerHTML=STANDALONE?`<section class="sheet"><h2>AI에게 묻기</h2><p class="muted" style="margin:6px 0 0">아래에 Google API 키를 넣으면 채팅을 쓸 수 있어요. 답은 Google Gemini가 해요.</p></section>${keyBox()}`
      :`<section class="sheet"><h2>Claude에게 묻기</h2><p class="muted" style="margin:6px 0 0">채팅은 claude.ai나 Claude 앱에서 이 페이지를 열었을 때 쓸 수 있어요. 허용을 거절했다면 페이지를 새로고침한 뒤 다시 허용해주세요.</p></section>`;
    return;
  }
  $("#main").innerHTML=`
    ${S.chat.length?"":`<section class="sheet"><span class="label">무엇이든 물어보세요</span>
      <p class="muted" style="margin:6px 0 12px">내 진도(정답률, 오답 유형, 몰라요 단어)를 보고 답해줘요. 문제나 단어를 부탁하면 앱에 바로 넣어줘요.</p>
      <div class="chips">${CHIPS.map(c=>`<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div></section>`}
    <div class="msgs" id="msgs">${S.chat.map(msgHtml).join("")}</div>
    ${S.chat.length&&!chatBusy?`<div class="row" style="justify-content:flex-end"><button class="btn ghost" style="padding:5px 10px;font-size:12px" data-act="chatclear">대화 지우기</button></div>`:""}
    <form class="composer" id="composer">
      <textarea id="chatin" rows="1" placeholder="예: 전치사 문제 5개 더 줘" aria-label="Claude에게 보낼 메시지">${esc(chatDraft)}</textarea>
      ${chatBusy?`<button type="button" class="btn ghost" data-act="chatstop">멈추기</button>`:`<button type="submit" class="btn print">보내기</button>`}
    </form>`;
  if(S.chat.length)requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight}));
}
function updateBubble(){
  const el=document.querySelectorAll("#msgs .msg.bot");const last=el[el.length-1];
  if(!last||tab!=="chat")return;
  last.outerHTML=msgHtml(S.chat[S.chat.length-1],S.chat.length-1);
  window.scrollTo({top:document.body.scrollHeight});
}
function cleanQs(arr){
  return (Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.q==="string"&&/-{3,}/.test(x.q)&&Array.isArray(x.c)&&x.c.length===4&&Number.isInteger(+x.a)&&+x.a>=0&&+x.a<4)
    .map((x,i)=>({id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+i,q:x.q,c:x.c.map(String),a:+x.a,cat:String(x.cat||""),ex:String(x.ex||"")}));
}
async function sendChat(text){
  text=text.trim();if(!text||chatBusy||!sample)return;
  S.chat=S.chat||[];
  const hist=S.chat.filter(m=>m.content).slice(-16).map(m=>({role:m.role,content:m.content}));
  while(hist.length&&hist[0].role!=="user")hist.shift();
  S.chat.push({role:"user",content:text});
  const bot={role:"assistant",content:"",acts:[]};S.chat.push(bot);
  chatDraft="";chatBusy=true;render();
  const turns=[{role:"user",content:rules()},{role:"assistant",content:"알겠어요. 학생 진도를 참고해서 도와줄게요."},...hist,{role:"user",content:text}];
  const tools=[
    {name:"add_part5_questions",description:"앱의 Part 5 문제 은행에 새 문제를 추가하고, 답장 아래에 '풀기' 버튼을 만든다. 반환: 추가된 개수. 학생이 연습 문제를 원할 때 사용.",
     inputSchema:{type:"object",properties:{questions:{type:"array",items:{type:"object",properties:{q:{type:"string",description:"빈칸을 -------로 표시한 영어 문장"},c:{type:"array",items:{type:"string"},description:"보기 4개"},a:{type:"integer",description:"정답 인덱스 0~3"},cat:{type:"string",description:"유형 (한국어 2~6자)"},ex:{type:"string",description:"한국어 해설 1~2문장"}},required:["q","c","a","cat","ex"]}}},required:["questions"]},
     execute:(input)=>{const ok=cleanQs(input&&input.questions);if(!ok.length)throw new Error("형식이 맞는 문제가 없어요. q에 -------, 보기 4개, a는 0~3.");S.gen=(S.gen||[]).concat(ok);bot.acts.push({type:"p5",ids:ok.map(q=>q.id),n:ok.length});save();updateBubble();return {added:ok.length};}},
    {name:"add_words",description:"앱 단어장에 새 토익 단어를 추가하고 답장 아래에 '퀴즈 하기' 버튼을 만든다. 이미 있는 단어는 건너뛴다. 반환: 추가된 개수.",
     inputSchema:{type:"object",properties:{words:{type:"array",items:{type:"object",properties:{w:{type:"string",description:"영어 단어/표현"},m:{type:"string",description:"한국어 뜻(짧게)"},h:{type:"string",description:"자주 쓰이는 짧은 영어 표현"}},required:["w","m","h"]}}},required:["words"]},
     execute:(input)=>{const exist=new Set(allWords().map(w=>w.w.toLowerCase()));const ok=(Array.isArray(input&&input.words)?input.words:[]).filter(x=>x&&typeof x.w==="string"&&typeof x.m==="string"&&!exist.has(x.w.toLowerCase())).map(x=>({w:x.w,m:x.m,h:String(x.h||"")}));S.genW=(S.genW||[]).concat(ok);if(ok.length)bot.acts.push({type:"voca",n:ok.length});save();updateBubble();return {added:ok.length,skipped_existing:(input&&input.words||[]).length-ok.length};}}
  ];
  chatCtl=new AbortController();
  try{
    const r=await sample(turns,{modelTier:"default",cache:false,signal:chatCtl.signal,tools,onText:({text})=>{bot.content=text;updateBubble();}});
    bot.content=r.text;
  }catch(e){
    bot.content=e&&e.text||bot.content||"";
    if(!e||e.code!=="cancelled")bot.err=errMsg(e).replace("만들 수 없어요","채팅을 쓸 수 없어요").replace("만들지 못했어요","답을 받지 못했어요");
  }finally{
    chatBusy=false;chatCtl=null;
    if(!bot.content&&!bot.err&&!bot.acts.length)bot.content="(멈췄어요)";
    if(S.chat.length>40)S.chat=S.chat.slice(-40);
    save();render();
  }
}
$("#main").addEventListener("submit",e=>{if(e.target.id==="keyform"){e.preventDefault();saveKey($("#gkeyin").value);return;}if(e.target.id==="composer"){e.preventDefault();sendChat($("#chatin").value);}});
$("#main").addEventListener("input",e=>{if(e.target.id==="chatin"){chatDraft=e.target.value;e.target.style.height="46px";e.target.style.height=Math.min(e.target.scrollHeight,140)+"px";}});
$("#main").addEventListener("keydown",e=>{if(e.target.id==="chatin"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();sendChat(e.target.value);}});

/* ---------- actions ---------- */
$("#main").addEventListener("click",e=>{
  const chip=e.target.closest("[data-chip]");if(chip){sendChat(chip.dataset.chip);return;}
  const ca=e.target.closest("[data-chatact]");if(ca){const [i,j]=ca.dataset.chatact.split("-").map(Number);const a=S.chat[i]&&S.chat[i].acts[j];if(!a)return;
    if(a.type==="p5"){const set=new Set(a.ids);const list=allQs().filter(q=>set.has(q.id));if(list.length){tab="p5";try{history.replaceState(null,"","#p5");}catch(_){}startP5(list);window.scrollTo({top:0});}}
    else{tab="voca";try{history.replaceState(null,"","#voca");}catch(_){}startV();window.scrollTo({top:0});}
    return;}
  const lp=e.target.closest("[data-lpick]");if(lp){if(LL&&LL.phase!=="review"){const [qi,i]=lp.dataset.lpick.split("-").map(Number);LL.picks[qi]=i;
    lp.parentElement.querySelectorAll(".opt").forEach(b=>b.classList.toggle("picked",b===lp));}return;}
  if(e.target.closest("[data-act='keydel']")){try{localStorage.removeItem(GK);}catch(_){}sample=null;keyMsg="키를 지웠어요.";render();return;}
  const cp=e.target.closest("[data-copy]");if(cp){const s=allSets().find(x=>x.id===cp.dataset.copy);if(!s)return;const text=scriptFor(s);
    const show=ok=>{copyBox={ok,text};render();if(!ok){const t=$("#copyarea");t&&t.select();}};
    try{navigator.clipboard.writeText(text).then(()=>show(true),()=>show(false));}catch(_){show(false);}return;}
  const pl=e.target.closest("[data-play]");if(pl){const s=allSets().find(x=>x.id===pl.dataset.play);if(s){copyBox=null;startSet(s);}return;}
  const ad=e.target.closest("[data-auddel]");if(ad){delAudio(ad.dataset.auddel).then(()=>{audMsg="음성을 지웠어요.";render();});return;}
  const rf=e.target.closest("[data-rf]");if(rf&&P){P.filter=rf.dataset.rf;render();return;}
  const aq=e.target.closest("[data-askq]");if(aq&&P){const r=P.res[+aq.dataset.askq];if(!r)return;const q=r.q;
    const txt=`이 Part 5 문제 더 자세히 설명해줘.\n문제: ${q.q}\n보기: ${q.c.map((o,j)=>L[j]+") "+o).join("  ")}\n내 답: ${L[r.pick]}) ${q.c[r.pick]} / 정답: ${L[q.a]}) ${q.c[q.a]}\n왜 다른 보기는 안 되는지도 알려주고, 비슷한 문제 3개를 앱에 넣어줘.`;
    go("chat");sendChat(txt);return;}
  if(e.target.closest("[data-act='p5retry']")&&P){const w=P.res.filter(r=>!r.ok).map(r=>r.q);startP5(w);window.scrollTo({top:0});return;}
  if(e.target.closest("[data-act='p5genweak']")&&P){const R=P.res,by={};R.forEach(r=>{if(!r.ok){const k=r.q.cat||"기타";by[k]=(by[k]||0)+1;}});genQ(Object.keys(by));return;}
  const rt=e.target.closest("[data-rate]");if(rt){S.rate=+rt.dataset.rate;save();render();return;}
  const la=e.target.closest("[data-act^='lc'],[data-act^='lgen']");
  if(la){const a=la.dataset.act;
    if(a==="lc3"||a==="lc4"){copyBox=null;startSet(nextSet(+a.slice(2)));}
    else if(a==="lcresume"){if(LL&&LL.audio){LL.blocked=false;render();curAudio=LL.audio;LL.audio.play().catch(()=>{LL.blocked=true;render();});}}
    else if(a==="lcplay")lcPlay();
    else if(a==="lcskip")lcReview();
    else if(a==="lchome"){if(LL)clearInterval(LL.timer);stopAudio();LL=null;render();}
    else if(a==="lcreplay")lcReplay();
    else if(a==="lcstop"){stopAudio();if(LL){LL.replaying=false;LL.line=-1;}render();}
    else if(a==="lcko"){showKo=!showKo;render();}
    else if(a==="lctest")voiceTest();
    else if(a==="lgen3"||a==="lgen4")genL(+a.slice(4));
    return;}
  const cs=e.target.closest("[data-act='chatstop'],[data-act='chatclear']");
  if(cs){if(cs.dataset.act==="chatstop")chatCtl&&chatCtl.abort();else{S.chat=[];save();render();}return;}
  const p=e.target.closest("[data-pick]");if(p){answer(+p.dataset.pick);return;}
  const vp=e.target.closest("[data-vpick]");if(vp){vAnswer(+vp.dataset.vpick);return;}
  const vf=e.target.closest("[data-vf]");if(vf){vFilter=vf.dataset.vf;render();return;}
  const a=e.target.closest("[data-act]");if(!a)return;
  switch(a.dataset.act){
    case "p5new":if(tab!=="p5"){tab="p5";}startP5(pickNew(10));break;
    case "p5wrong":{const ids=Object.keys(S.wrong);tab="p5";try{history.replaceState(null,"","#p5");}catch(_){}startP5(shuffle(allQs().filter(q=>ids.includes(q.id))).slice(0,10));break;}
    case "p5next":nextQ();break;
    case "p5home":P=null;clearInterval(window._t);render();break;
    case "genq":genQ();break;
    case "genw":genW();break;
    case "vstart":startV();break;
    case "vnext":V.idx++;V.picked=null;mkOpts();render();break;
    case "vdunno":vAnswer(-1);break;
    case "vhome":V=null;render();break;
  }
  window.scrollTo({top:Math.min(window.scrollY,0)});
});

render();
</script>
